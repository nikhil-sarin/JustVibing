<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Hardline</title>
<style>
  :root { --bg:#05070b; --panel:#0e131c; --line:#2a3445; --text:#e8edf5; --dim:#8b97ab; --red:#ff4d4d; --gold:#ffd93d; --good:#5dffa0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--text); overflow: hidden; overscroll-behavior: none;
    font: 15px/1.25 system-ui, -apple-system, "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #view { image-rendering: pixelated; image-rendering: crisp-edges; }
  #hud { pointer-events: none; }

  /* touch controls */
  #touch { position: fixed; inset: 0; display: none; }
  body.touch #touch.on { display: block; }
  .zone { position: absolute; touch-action: none; }
  #stickZone { left: 0; bottom: 0; width: 46%; height: 70%; }
  #lookZone { right: 0; top: 0; width: 54%; height: 100%; }
  #stickBase, #stickKnob { position: absolute; border-radius: 50%; pointer-events: none; display: none; }
  #stickBase { width: 120px; height: 120px; margin: -60px 0 0 -60px; border: 2px solid #ffffff55; background: #ffffff10; }
  #stickKnob { width: 54px; height: 54px; margin: -27px 0 0 -27px; background: #ffffff66; }
  .btn { position: absolute; border-radius: 50%; border: 2px solid #ffffff66; background: #ffffff1c; color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 700; touch-action: none; user-select: none; }
  .btn:active, .btn.down { background: #ffffff44; }
  #fireBtn { right: max(26px, env(safe-area-inset-right)); bottom: 28px; width: 92px; height: 92px; font-size: 15px; background: #ff4d4d33; border-color: #ff4d4daa; }
  #aimBtn { right: 138px; bottom: 34px; width: 62px; height: 62px; font-size: 13px; }
  #reloadBtn { right: 40px; bottom: 134px; width: 58px; height: 58px; font-size: 12px; }
  #swapBtn { right: 112px; bottom: 112px; width: 58px; height: 58px; font-size: 12px; }
  #pauseBtn { left: 50%; top: 8px; margin-left: -20px; width: 40px; height: 40px; font-size: 16px; opacity: .75; }

  .overlay { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: #05070bee; padding: 14px; overflow: auto; touch-action: pan-y; }
  .overlay.show { display: flex; }
  .card { width: 100%; max-width: 560px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; max-height: 100%; overflow: auto; }
  .card h1 { margin: 0 0 2px; font-size: 30px; letter-spacing: .12em; } .card h1 span { color: var(--red); }
  .card p.sub { color: var(--dim); margin: 0 0 12px; }
  .card h3 { margin: 14px 0 6px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button.b { font: inherit; color: var(--text); background: #151c28; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 46px; cursor: pointer; flex: 1; }
  button.b.on { background: #2a3550; outline: 2px solid var(--text); } button.b:disabled { opacity: .4; }
  button.b small { display: block; color: var(--dim); font-size: 12px; margin-top: 2px; font-weight: 400; }
  button.go { background: #5a1b1b; border-color: #a33; font-weight: 700; font-size: 17px; margin-top: 14px; width: 100%; min-height: 54px; position: sticky; bottom: 0; }
  @media (max-height: 520px) { .card { padding: 12px 16px; } .card h1 { font-size: 24px; } .card h3 { margin: 8px 0 4px; } button.b { min-height: 38px; padding: 6px 10px; } button.go { margin-top: 8px; min-height: 46px; } .card p.sub { margin: 0 0 6px; } }
  .help { color: var(--dim); font-size: 13px; line-height: 1.5; }
  .help b { color: var(--text); }
  .stat { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #1c2433; color: var(--dim); } .stat b { color: var(--text); }
  .shop { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  @media (max-width: 480px) { .shop { grid-template-columns: 1fr; } }
  .pts { color: var(--gold); font-weight: 700; }
  a.back { color: var(--dim); text-decoration: none; font-size: 14px; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<canvas id="hud"></canvas>

<div id="touch">
  <div id="stickZone" class="zone"></div>
  <div id="lookZone" class="zone"></div>
  <div id="stickBase"></div><div id="stickKnob"></div>
  <div id="fireBtn" class="btn">FIRE</div>
  <div id="aimBtn" class="btn">AIM</div>
  <div id="reloadBtn" class="btn">RELOAD</div>
  <div id="swapBtn" class="btn">SWAP</div>
  <div id="pauseBtn" class="btn">⏸</div>
</div>

<div id="menu" class="overlay show"><div class="card">
  <a class="back" href="../../">← All apps</a>
  <h1>HARD<span>LINE</span></h1>
  <p class="sub">Survive the waves. Earn points. Upgrade your arsenal.</p>
  <h3>Map</h3><div class="row" id="mapBtns"></div>
  <p class="help" id="mapDesc"></p>
  <h3>Difficulty</h3><div class="row" id="diffBtns"></div>
  <h3>Graphics</h3><div class="row" id="qualBtns"></div>
  <h3>Look sensitivity</h3><div class="row" id="sensBtns"></div>
  <h3>Sound</h3><div class="row" id="soundBtns"></div>
  <h3>Controls</h3>
  <div class="help" id="helpTxt"></div>
  <button class="b go" id="startBtn">DEPLOY</button>
  <button class="b" id="fsBtn" style="margin-top:8px;width:100%">⛶ Fullscreen / landscape</button>
</div></div>

<div id="pause" class="overlay"><div class="card">
  <h1>PAUSED</h1>
  <button class="b go" id="resumeBtn">RESUME</button>
  <button class="b" id="quitBtn" style="margin-top:8px;width:100%">Quit to menu</button>
</div></div>

<div id="armory" class="overlay"><div class="card">
  <h1 id="armTitle">WAVE CLEARED</h1>
  <p class="sub">Points: <span class="pts" id="armPts">0</span></p>
  <div class="shop" id="shop"></div>
  <button class="b go" id="nextBtn">START WAVE</button>
</div></div>

<div id="dead" class="overlay"><div class="card">
  <h1 style="color:var(--red)">K.I.A.</h1>
  <div id="deadStats"></div>
  <button class="b go" id="againBtn">TRY AGAIN</button>
  <button class="b" id="menuBtn" style="margin-top:8px;width:100%">Main menu</button>
</div></div>

<script>

  sniper:  { name: "Bolt .308",dmg: 230, rate: 1.25, mag: 5,   reserve: 30,  reload: 2.4, spread: 0.06,  pellets: 1, auto: false, price: 1200, len: 210, w: 28, col: "#1f2b24", snd: "sniper", scope: true },

};

const QUAL = { fast: 520, high: 800 };
const SENS = { low: 0.0026, med: 0.0042, high: 0.0065 };
const isTouch = matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;
if (isTouch) document.body.classList.add("touch");

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const SET = Object.assign({ map: "warehouse", diff: "regular", qual: "fast", sens: "med", sound: true }, store.get("hl-settings", {}));
const saveSet = () => store.set("hl-settings", SET);
const view = $("view"), vctx = view.getContext("2d", { alpha: false }), hud = $("hud"), g = hud.getContext("2d");

// ---------- audio (synthesised) ----------
let AC = null, noiseBuf = null;
function ac() {
  if (!SET.sound) return null;
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
  if (AC.state === "suspended") AC.resume();
  return AC;
}
function tone(f, dur, type = "sine", vol = 0.15, slide = 0) {
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), gn = a.createGain(), t = a.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + dur);
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(gn).connect(a.destination); o.start(t); o.stop(t + dur);
}
function burst(dur, vol, hp = 500, lp = 6000) {
  const a = ac(); if (!a) return;
  if (!noiseBuf) { noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const s = a.createBufferSource(), h = a.createBiquadFilter(), l = a.createBiquadFilter(), gn = a.createGain(), t = a.currentTime;
  s.buffer = noiseBuf; h.type = "highpass"; h.frequency.value = hp; l.type = "lowpass"; l.frequency.value = lp;
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(h).connect(l).connect(gn).connect(a.destination); s.start(t, Math.random() * 0.5); s.stop(t + dur);
}
const SND = {
  pistol: () => { burst(0.12, 0.28, 500, 5000); tone(170, 0.1, "square", 0.1, -100); },
  rifle: () => { burst(0.1, 0.3, 300, 4500); tone(120, 0.09, "sawtooth", 0.12, -70); },
  smg: () => { burst(0.08, 0.24, 500, 5500); tone(150, 0.07, "square", 0.08, -80); },
  shotgun: () => { burst(0.35, 0.45, 100, 2600); tone(80, 0.3, "sawtooth", 0.2, -50); },
  sniper: () => { burst(0.55, 0.5, 80, 3200); tone(60, 0.5, "sawtooth", 0.25, -35); },
  lmg: () => { burst(0.1, 0.32, 150, 3500); tone(90, 0.1, "sawtooth", 0.16, -50); },
  enemy: (d) => { const v = clamp(0.18 - d * 0.015, 0.02, 0.18); burst(0.08, v, 400, 3000); },
  hit: () => tone(1000, 0.04, "square", 0.07),
  kill: () => { tone(500, 0.12, "triangle", 0.14, 400); },
  hurt: () => { tone(110, 0.22, "sine", 0.3, -50); burst(0.1, 0.12, 100, 900); },
  reload: () => { burst(0.03, 0.18, 2000, 8000); setTimeout(() => burst(0.04, 0.2, 1500, 7000), 380); },
  pickup: () => { tone(700, 0.08, "triangle", 0.12, 400); },
  wave: () => { tone(110, 0.8, "sawtooth", 0.2, 30); tone(165, 0.8, "square", 0.08, 30); },
  empty: () => tone(300, 0.04, "square", 0.06),
};

// ---------- procedural art ----------
function mkTex(fn, grain = 16) {
  const c = document.createElement("canvas"); c.width = c.height = 64; const x = c.getContext("2d"); fn(x);
  const id = x.getImageData(0, 0, 64, 64), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - 0.5) * grain; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  x.putImageData(id, 0, 0); return c;
}
const TEX = [null,
  mkTex(x => { x.fillStyle = "#5e4338"; x.fillRect(0, 0, 64, 64); x.fillStyle = "#8f4f3d"; for (let r = 0; r < 8; r++) { const off = (r % 2) * 8; for (let c = -1; c < 4; c++) x.fillRect(c * 16 + off + 1, r * 8 + 1, 14, 6); } }),
  mkTex(x => { x.fillStyle = "#8a8d92"; x.fillRect(0, 0, 64, 64); x.strokeStyle = "#6a6d73"; x.lineWidth = 2; x.strokeRect(1, 1, 62, 62); x.beginPath(); x.moveTo(0, 32); x.lineTo(64, 32); x.stroke(); x.fillStyle = "#7a7d82"; x.fillRect(8, 40, 20, 3); }),
  mkTex(x => { x.fillStyle = "#3d5a78"; x.fillRect(0, 0, 64, 64); x.fillStyle = "#4d6f93"; x.fillRect(3, 3, 58, 26); x.fillRect(3, 35, 58, 26); x.fillStyle = "#223449"; for (const [a, b] of [[6, 6], [58, 6], [6, 58], [58, 58], [6, 32], [58, 32]]) { x.beginPath(); x.arc(a, b, 2, 0, 7); x.fill(); } }),
  mkTex(x => { x.fillStyle = "#a37a45"; x.fillRect(0, 0, 64, 64); x.strokeStyle = "#5d4023"; x.lineWidth = 4; x.strokeRect(2, 2, 60, 60); x.lineWidth = 3; x.beginPath(); x.moveTo(4, 4); x.lineTo(60, 60); x.moveTo(60, 4); x.lineTo(4, 60); x.stroke(); }),
  mkTex(x => { x.fillStyle = "#d9b200"; x.fillRect(0, 0, 64, 64); x.fillStyle = "#1b1b1b"; for (let i = -2; i < 8; i++) { x.beginPath(); x.moveTo(i * 14, 0); x.lineTo(i * 14 + 8, 0); x.lineTo(i * 14 + 8 - 64, 64); x.lineTo(i * 14 - 64, 64); x.closePath(); x.fill(); } }, 10),
  mkTex(x => { x.fillStyle = "#1f2a3a"; x.fillRect(0, 0, 64, 64); x.fillStyle = "#16e0c0"; x.fillRect(6, 8, 52, 4); x.fillStyle = "#0b6e66"; for (let i = 0; i < 5; i++) x.fillRect(8, 20 + i * 8, 48, 5); x.fillStyle = "#ffcc33"; x.fillRect(50, 24, 6, 6); }, 8),
];
// floor / ceiling texels (packed ABGR with separate rgb for shading)
function mkFlat(fn) { const c = mkTex(fn, 14), d = c.getContext("2d").getImageData(0, 0, 64, 64).data, out = new Uint8Array(64 * 64 * 3); for (let i = 0, j = 0; i < d.length; i += 4, j += 3) { out[j] = d[i]; out[j + 1] = d[i + 1]; out[j + 2] = d[i + 2]; } return out; }
const FLOOR = mkFlat(x => { x.fillStyle = "#3a3f48"; x.fillRect(0, 0, 64, 64); x.fillStyle = "#2f343c"; x.fillRect(0, 0, 32, 32); x.fillRect(32, 32, 32, 32); x.strokeStyle = "#232830"; x.lineWidth = 2; x.strokeRect(0, 0, 64, 64); });
const CEIL = mkFlat(x => { x.fillStyle = "#1e232d"; x.fillRect(0, 0, 64, 64); x.fillStyle = "#2a303c"; x.fillRect(2, 2, 60, 60); x.fillStyle = "#e8e2b0"; x.fillRect(24, 28, 16, 8); });

function mkSprite(w, h, fn) { const c = document.createElement("canvas"); c.width = w; c.height = h; fn(c.getContext("2d")); return c; }
function tinted(c, col = "rgba(255,255,255,.7)") { const t = document.createElement("canvas"); t.width = c.width; t.height = c.height; const x = t.getContext("2d"); x.drawImage(c, 0, 0); x.globalCompositeOperation = "source-atop"; x.fillStyle = col; x.fillRect(0, 0, c.width, c.height); return t; }
const rr = (x, a, b, w, h, col) => { x.fillStyle = col; x.fillRect(a, b, w, h); };
function drawSoldier(x, o, f) {
  const leg = f === 0 ? 3 : f === 1 ? -3 : 0;
  rr(x, 20, 60 + leg, 10, 30 - leg, o.pants); rr(x, 34, 60 - leg, 10, 30 + leg, o.pants);
  rr(x, 18, 88 + leg, 14, 6, "#16181b"); rr(x, 32, 88 - leg, 14, 6, "#16181b");
  rr(x, 17, 30, 30, 32, o.vest); rr(x, 21, 34, 22, 10, o.vest2);
  rr(x, 10, 32, 8, 26, o.vest); rr(x, 46, 34, 8, 22, o.vest);
  x.fillStyle = o.skin; x.beginPath(); x.arc(32, 20, 10, 0, 7); x.fill();
  x.fillStyle = o.helmet; x.beginPath(); x.arc(32, 18, 11, Math.PI, 0); x.fill(); rr(x, 21, 17, 22, 3, o.helmet);
  rr(x, 26, 20, 4, 3, o.eye); rr(x, 35, 20, 4, 3, o.eye);
  rr(x, 36, 44, 27, 6, "#15171a"); rr(x, 44, 50, 4, 10, "#15171a");
  if (f === 2) { x.fillStyle = "#ffd24d"; x.beginPath(); x.arc(64, 47, 7, 0, 7); x.fill(); x.fillStyle = "#fff"; x.beginPath(); x.arc(64, 47, 3, 0, 7); x.fill(); }
}
function drawRusher(x, o, f) {
  const l = f === 0 ? 4 : f === 1 ? -4 : 0;
  rr(x, 22, 62 + l, 8, 28 - l, "#3b3a2e"); rr(x, 34, 62 - l, 8, 28 + l, "#3b3a2e");
  x.fillStyle = "#5b7a3d"; x.beginPath(); x.moveTo(18, 34); x.lineTo(46, 34); x.lineTo(42, 64); x.lineTo(22, 64); x.fill();
  rr(x, 18, 38, 28, 8, "#4a3a2a"); rr(x, 5, 36, 14, 6, "#5b7a3d"); rr(x, 46, 36, 14, 6, "#5b7a3d");
  x.fillStyle = "#6f9248"; x.beginPath(); x.arc(32, 24, 11, 0, 7); x.fill();
  rr(x, 24, 21, 6, 5, "#ffe34d"); rr(x, 35, 21, 6, 5, "#ffe34d"); rr(x, 27, 29, 11, 3, "#3a1010");
  if (f === 2) rr(x, 2, 34, 8, 4, "#a33");

function drawHeavy(x, o, f) {
  const leg = f === 0 ? 2 : f === 1 ? -2 : 0;
  rr(x, 16, 62 + leg, 14, 28 - leg, "#3a3d44"); rr(x, 34, 62 - leg, 14, 28 + leg, "#3a3d44"); rr(x, 14, 88, 18, 6, "#111"); rr(x, 32, 88, 18, 6, "#111");
  rr(x, 8, 26, 48, 38, o.vest); rr(x, 14, 32, 36, 14, o.vest2); rr(x, 0, 28, 10, 30, o.vest); rr(x, 54, 30, 10, 28, o.vest);
  x.fillStyle = o.helmet; x.beginPath(); x.arc(32, 16, 13, 0, 7); x.fill(); rr(x, 22, 14, 20, 6, "#10151c"); rr(x, 24, 15, 5, 3, o.eye); rr(x, 35, 15, 5, 3, o.eye);

// ---------- HUD ----------
function drawWeapon(g, VW, VH) {
  const w = curW(), s = Math.min(VW, VH) / 380, kick = P.kick, t = gTime;
  let bx = Math.sin(P.bob) * 7 * s, by = Math.abs(Math.cos(P.bob)) * 6 * s + kick * 16 * s;
  if (P.reload > 0) { const k = Math.sin(Math.min(1, (w.reload - P.reload) / w.reload) * Math.PI); by += k * 90 * s; bx += k * 20 * s; }
  if (P.aim) { bx = -VW * 0.1; by *= 0.3; }

  if (P.aim && w.scope) { g.restore(); return; }

  g.fillStyle = "#16181d"; g.fillRect(-w.w * 0.5 + 6, -w.len, w.w - 12, w.len - 18);                    // barrel/body core
  g.fillStyle = w.col; g.fillRect(-w.w / 2, -w.len * 0.7, w.w, w.len * 0.7 - 10);
  g.fillStyle = "#0c0d10"; g.fillRect(-5, -w.len - 22, 10, 26);                                       // muzzle
  g.fillStyle = "#33363d"; g.fillRect(-w.w / 2 - 3, -w.len * 0.45, 6, 36); g.fillRect(w.w / 2 - 3, -w.len * 0.5, 6, 18);
  if (P.cur === "shotgun") { g.fillStyle = "#6a4a30"; g.fillRect(-w.w / 2 - 2, -w.len * 0.5, w.w + 4, 40); }
  if (P.cur === "sniper") { g.fillStyle = "#101010"; g.fillRect(-9, -w.len * 0.85, 18, 56); g.fillStyle = "#4a8"; g.fillRect(-6, -w.len * 0.85, 12, 4); }
  if (P.cur === "lmg") { g.fillStyle = "#2f3b2a"; g.fillRect(w.w / 2, -w.len * 0.3, 26, 44); }
  else if (P.cur !== "pistol") { g.fillStyle = "#222"; g.fillRect(w.w / 2 - 2, -w.len * 0.34, 12, 36); }
  g.fillStyle = "#c9a27a"; g.fillRect(-w.w / 2 - 8, -22, 22, 26);                                      // trigger hand
  if (P.flash > 0) { g.fillStyle = "#ffe08a"; g.beginPath(); for (let i = 0; i < 10; i++) { const a = i / 10 * 6.283, r = i % 2 ? 14 : 34; g.lineTo(Math.cos(a) * r, -w.len - 34 + Math.sin(a) * r); } g.fill(); }

}
function drawHUD() {
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, VW, VH);
  const cx = VW / 2, cy = VH / 2 + P.pitch * VH * 0 + 0, w = curW(), s = P.w[P.cur], u = Math.min(VW, VH) / 400;
  // low health vignette / hurt flash

  if (lowA > 0) { const gr = g.createRadialGradient(cx, cy, Math.min(VW, VH) * 0.25, cx, cy, Math.max(VW, VH) * 0.7); gr.addColorStop(0, "rgba(120,0,0,0)"); gr.addColorStop(1, `rgba(150,0,0,${lowA})`); g.fillStyle = gr; g.fillRect(0, 0, VW, VH); }

    const R = Math.min(VW, VH) * 0.46; g.fillStyle = "#000"; g.beginPath(); g.rect(0, 0, VW, VH); g.moveTo(cx + R, cy); g.arc(cx, cy, R, 0, Math.PI * 2, true); g.closePath(); g.fill("evenodd");

  } else {

    g.beginPath(); g.moveTo(cx - spread - 8 * u, cy); g.lineTo(cx - spread, cy); g.moveTo(cx + spread, cy); g.lineTo(cx + spread + 8 * u, cy); g.moveTo(cx, cy - spread - 8 * u); g.lineTo(cx, cy - spread); g.moveTo(cx, cy + spread); g.lineTo(cx, cy + spread + 8 * u); g.stroke();

  g.fillStyle = "#ffd93d"; g.fillText(`${P.points} pts`, 14, 44 * u);
  g.fillStyle = "#9fb0c8"; g.font = `${13 * u}px system-ui`; g.fillText(`${enemies.filter(e => !e.dead).length + queue.length} hostiles`, 14, 62 * u);

}

// ---------- input ----------
function lookDelta(dx, dy) { input.lookX += dx; input.lookY += dy; }
addEventListener("keydown", e => {
  if (state === "playing") {
    input.keys[e.code] = true;
    if (e.code === "KeyR") startReload(); if (e.code === "KeyQ") selectWeapon(P.last); if (e.code === "KeyF") cycleWeapon();
    const n = ["Digit1", "Digit2", "Digit3", "Digit4", "Digit5", "Digit6"].indexOf(e.code); if (n >= 0) selectWeapon(Object.keys(WEAPONS)[n]);
    if (e.code === "Escape" || e.code === "KeyP") pauseGame();
    if (e.code === "Space") { input.fire = true; input.fireEdge = true; }
    if (!/^F\d+$/.test(e.code)) e.preventDefault();
  } else if (state === "paused" && (e.code === "Escape" || e.code === "KeyP")) resume();
});
addEventListener("keyup", e => { input.keys[e.code] = false; if (e.code === "Space") input.fire = false; });
addEventListener("mousemove", e => { if (document.pointerLockElement === hud || document.pointerLockElement === view) lookDelta(e.movementX * 0.55, e.movementY * 0.55); });
addEventListener("mousedown", e => {
  if (state !== "playing" || isTouch || e.target.closest(".overlay")) return;
  if (!document.pointerLockElement && view.requestPointerLock) { try { view.requestPointerLock(); } catch {} }
  if (e.button === 0) { input.fire = true; input.fireEdge = true; } else if (e.button === 2) input.aim = true;
});
addEventListener("mouseup", e => { if (e.button === 0) input.fire = false; if (e.button === 2) input.aim = false; });
addEventListener("contextmenu", e => e.preventDefault());
addEventListener("wheel", e => { if (state === "playing") cycleWeapon(); });
document.addEventListener("pointerlockchange", () => { if (!document.pointerLockElement && state === "playing" && !isTouch) pauseGame(); });
document.addEventListener("visibilitychange", () => { if (document.hidden && state === "playing") pauseGame(); });

// touch
(function touchSetup() {
  const stick = $("stickZone"), look = $("lookZone"), base = $("stickBase"), knob = $("stickKnob");
  let sid = null, ox = 0, oy = 0, lid = null, lx = 0, ly = 0;
  const R = 55;
  stick.addEventListener("pointerdown", e => { if (sid !== null) return; sid = e.pointerId; stick.setPointerCapture(sid); ox = e.clientX; oy = e.clientY;
    base.style.cssText = `display:block;left:${ox}px;top:${oy}px`; knob.style.cssText = `display:block;left:${ox}px;top:${oy}px`; });
  stick.addEventListener("pointermove", e => { if (e.pointerId !== sid) return; let dx = e.clientX - ox, dy = e.clientY - oy; const d = Math.hypot(dx, dy); if (d > R) { dx = dx / d * R; dy = dy / d * R; }

  const stickEnd = e => { if (e.pointerId !== sid) return; sid = null; input.mvx = input.mvy = 0; base.style.display = knob.style.display = "none"; };

  look.addEventListener("pointerdown", e => { if (lid !== null) return; lid = e.pointerId; look.setPointerCapture(lid); lx = e.clientX; ly = e.clientY; });
  look.addEventListener("pointermove", e => { if (e.pointerId !== lid) return; lookDelta((e.clientX - lx) * 1.0, (e.clientY - ly) * 1.0); lx = e.clientX; ly = e.clientY; });
  const lookEnd = e => { if (e.pointerId === lid) lid = null; }; look.addEventListener("pointerup", lookEnd); look.addEventListener("pointercancel", lookEnd);

  const fb = $("fireBtn"); hold(fb, e => { input.fire = true; input.fireEdge = true; fid = e.pointerId; fx = e.clientX; fy = e.clientY; }, () => { input.fire = false; fid = null; });
  fb.addEventListener("pointermove", e => { if (e.pointerId !== fid) return; lookDelta((e.clientX - fx) * 1.0, (e.clientY - fy) * 1.0); fx = e.clientX; fy = e.clientY; });

  hold($("aimBtn"), () => { input.aim = !input.aim; $("aimBtn").style.background = input.aim ? "#ffd93d55" : ""; });

})();

// ---------- menus ----------

    b.onclick = () => { SET[key] = v; saveSet(); renderMenu(); after && after(); }; box.append(b); }
}
function renderMenu() {

  $("mapDesc").textContent = MAPS[SET.map].desc;
  seg("diffBtns", [["recruit", "Recruit", "easier"], ["regular", "Regular", ""], ["veteran", "Veteran", "brutal"]], "diff");
  seg("qualBtns", [["fast", "Fast", "smooth"], ["high", "High", "sharper"]], "qual", resize);
  seg("sensBtns", [["low", "Low"], ["med", "Medium"], ["high", "High"]], "sens");

    ? "<b>Left thumb:</b> move · <b>Right thumb:</b> drag to look · <b>FIRE</b> (hold; drag it to aim while shooting) · <b>AIM</b> zoom · <b>SWAP</b> weapons · <b>RELOAD</b>. Landscape is best."
    : "<b>WASD</b> move · <b>mouse</b> look · <b>click</b> fire · <b>right-click</b> aim · <b>R</b> reload · <b>1-6 / Q / wheel</b> weapons · <b>Shift</b> sprint · <b>Esc</b> pause. Click the game to capture the mouse.";
}
function begin() { $("menu").classList.remove("show"); $("dead").classList.remove("show"); $("pause").classList.remove("show"); $("touch").classList.add("on"); newGame(); ac(); if (!isTouch) view.requestPointerLock && view.requestPointerLock(); }

$("startBtn").onclick = begin; $("againBtn").onclick = begin; $("resumeBtn").onclick = resume; $("quitBtn").onclick = toMenu; $("menuBtn").onclick = toMenu;
$("nextBtn").onclick = () => { startWave(); if (!isTouch) view.requestPointerLock && view.requestPointerLock(); };

// ---------- main loop ----------
let last = performance.now();
function frame(now) {

loadMap(SET.map); P = { x: startPos.x, y: startPos.y, ang: 0.7, pitch: 0, fov: 1.25, aim: false, bob: 0, moving: false, kick: 0, flash: 0, hit: 0, kill: 0, hurtFlash: 0, cur: "rifle", reload: 0, hp: 100, armor: 0, points: 0, kills: 0, w: { rifle: { mag: 30, res: 90 } } };
