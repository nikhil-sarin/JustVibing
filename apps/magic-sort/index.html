<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Magic Sort</title>
<style>
  :root { --bg1:#2a1458; --bg2:#140a2e; --panel:#241347; --line:#4a3a85; --text:#f1eaff; --dim:#a99bd6; --gold:#ffd93d; --good:#7dffb0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; color: var(--text); overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none;
    font: 16px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(ellipse at 50% 0%, var(--bg1), var(--bg2) 70%) fixed, var(--bg2); }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .5;
    background-image: radial-gradient(1.5px 1.5px at 20% 30%, #fff 50%, transparent), radial-gradient(1px 1px at 70% 20%, #fff 50%, transparent),
      radial-gradient(1.5px 1.5px at 40% 75%, #fff 50%, transparent), radial-gradient(1px 1px at 85% 65%, #fff 50%, transparent),
      radial-gradient(1px 1px at 10% 85%, #fff 50%, transparent), radial-gradient(1.5px 1.5px at 60% 50%, #fff 50%, transparent); }
  #app { position: relative; display: flex; flex-direction: column; height: 100%; max-width: 620px; margin: 0 auto;
    padding: env(safe-area-inset-top) 10px env(safe-area-inset-bottom); gap: 8px; }
  header { display: flex; align-items: center; justify-content: space-between; padding-top: 8px; gap: 10px; }
  header .title { text-align: center; flex: 1; }
  header .title b { font-size: 20px; letter-spacing: .02em; } header .title small { display: block; color: var(--dim); font-size: 12px; margin-top: 2px; }
  header .moves { min-width: 54px; text-align: right; } header .moves small { display: block; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  header .moves b { font-size: 20px; font-variant-numeric: tabular-nums; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px 6px; min-height: 52px; flex: 1; }
  button small { color: var(--dim); font-size: 12px; } button:disabled { opacity: .35; }
  button.icon { flex: none; width: 46px; min-height: 42px; padding: 0; font-size: 20px; }
  #note { text-align: center; color: var(--dim); font-size: 13px; background: #ffffff0d; border-radius: 10px; padding: 6px 10px; }
  #board { position: relative; flex: 1; min-height: 0; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: var(--rowgap, 16px) var(--colgap, 10px); margin: 0 auto; width: 100%; }
  footer { display: flex; gap: 8px; padding-bottom: 8px; }
  footer button { font-size: 20px; }

  .tube { position: relative; width: var(--tw); height: calc(var(--cap) * var(--lh) + 6px); flex: none; cursor: pointer; transition: transform .25s ease;
    border: 2px solid #ffffff4d; border-top: none; border-radius: 4px 4px calc(var(--tw) / 2) calc(var(--tw) / 2);
    background: linear-gradient(90deg, #ffffff22, #ffffff08 40%, #ffffff14); box-shadow: inset 0 0 8px #ffffff12; }
  .tube::before { content: ""; position: absolute; left: -5px; right: -5px; top: -7px; height: 8px; border-radius: 6px; background: #ffffff38; border: 1px solid #ffffff4d; }
  .tube.sel { transform: translateY(calc(var(--lh) * -0.5)); }
  .tube.hint { animation: hint 0.9s ease-in-out 2; }
  .tube.shake { animation: shake .3s; }
  .tube.done { box-shadow: 0 0 14px 2px #ffd93d99, inset 0 0 8px #ffffff22; border-color: #ffd93daa; }
  .tube.done::after { content: ""; position: absolute; left: 12%; right: 12%; top: -16px; height: 14px; border-radius: 6px 6px 2px 2px; background: linear-gradient(#c58a4a, #8a5a2b); }
  .liquid { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column-reverse; overflow: hidden; border-radius: 0 0 calc(var(--tw) / 2) calc(var(--tw) / 2); }
  .layer { position: relative; height: var(--lh); background: var(--c); display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 -1px 0 #0003, inset 4px 0 0 #ffffff2a, inset -3px 0 0 #0000001f; font-size: calc(var(--lh) * .5); color: #00000066; }
  .layer.new { animation: fill .35s ease-out; transform-origin: bottom; }
  .layer.fog { background: repeating-linear-gradient(45deg, #2d2060, #2d2060 6px, #382a73 6px, #382a73 12px); color: #ffffff55; }
  .stream { position: absolute; width: 6px; border-radius: 3px; transform-origin: top; animation: stream .15s ease-out forwards; pointer-events: none; z-index: 6; }
  @keyframes fill { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes stream { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  @keyframes hint { 50% { box-shadow: 0 0 16px 4px #7dffb0; } }

  .overlay { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: #0c0620e6; padding: 20px; overflow: auto; }
  .overlay.show { display: flex; }
  .card { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 22px; text-align: center; }
  .card h1 { margin: 0 0 6px; font-size: 26px; } .card p { color: var(--dim); margin: 0 0 14px; }
  .stars { font-size: 42px; letter-spacing: 6px; margin: 8px 0 10px; } .stars .off { opacity: .25; filter: grayscale(1); }
  .card button { width: 100%; margin-top: 10px; flex: none; }
  #levels .card { max-height: 100%; overflow: auto; }
  #grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 12px 0; max-height: 44vh; overflow-y: auto; padding: 2px; }
  #grid button { min-height: 52px; padding: 4px; flex: none; font-weight: 700; } #grid button small { font-size: 10px; color: var(--gold); letter-spacing: 1px; }
  #grid button.cur { outline: 2px solid var(--gold); } #grid button:disabled { opacity: .3; }
  .toggle { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px; color: var(--text); text-align: left; }
  .toggle button { width: 64px; min-height: 36px; margin: 0; }
  a.back { color: var(--dim); text-decoration: none; font-size: 14px; display: block; text-align: left; margin-bottom: 6px; }
  .spark { position: fixed; pointer-events: none; z-index: 30; font-size: 22px; animation: spark 1.1s ease-out forwards; }
  @keyframes spark { from { opacity: 1; transform: translate(0,0) scale(.6); } to { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.4); } }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="icon" id="menuBtn" title="Levels">☰</button>
    <div class="title"><b id="lvl">Level 1</b><small id="sub"></small></div>
    <div class="moves"><small>Moves</small><b id="moves">0</b></div>
  </header>
  <div id="note" hidden>🌫️ Fog level: only the top potion in each flask is visible</div>
  <main id="board"></main>
  <footer>
    <button id="undo">↶<small>Undo</small></button>
    <button id="restart">↻<small>Restart</small></button>
    <button id="hint">💡<small>Hint</small></button>
    <button id="extra">➕<small>Flask</small></button>
  </footer>
</div>

<div id="win" class="overlay"><div class="card">
  <h1>Level complete!</h1>
  <div class="stars" id="stars"></div>
  <p id="wintext"></p>
  <button id="next"><b>Next level ▶</b></button>
  <button id="replay">Replay</button>
</div></div>

<div id="levels" class="overlay"><div class="card">
  <a class="back" href="../../">← All apps</a>
  <h1>✨ Magic Sort</h1>
  <p>Pour potions so every flask holds one colour.</p>
  <div id="grid"></div>
  <div class="toggle"><span>Colour-blind symbols</span><button id="symBtn">Off</button></div>
  <button id="resetBtn"><small>Reset all progress</small></button>
  <button id="closeLevels"><b>Close</b></button>
</div></div>

<script>
"use strict";
// ---------- config ----------
const COLORS = ["#ff4d6d", "#ff9f43", "#ffd93d", "#b5e61d", "#1fa35b", "#17c3b2", "#48dbfb", "#4d79ff", "#8a6bff", "#d36bff", "#ff7eb6", "#b0724a"];
const GLYPHS = ["●", "▲", "■", "◆", "★", "♥", "♣", "☾", "✚", "⬟", "✿", "☀"];
function levelConfig(n) {
  return { colors: Math.min(12, 3 + Math.floor((n - 1) * 0.55)), cap: n >= 24 ? 5 : 4, empties: 2, fog: n >= 10 && n % 5 === 0 };
}

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- rules ----------
const topColor = t => t.length ? t[t.length - 1] : -1;
function topRun(t) { let k = 0; const c = topColor(t); while (k < t.length && t[t.length - 1 - k] === c) k++; return k; }
function pourAmount(tubes, i, j, cap) {
  const a = tubes[i], b = tubes[j];
  if (i === j || !a.length || b.length >= cap) return 0;
  if (b.length && topColor(b) !== topColor(a)) return 0;
  return Math.min(topRun(a), cap - b.length);
}
const tubeDone = (t, cap) => t.length === cap && t.every(c => c === t[0]);
const solved = (tubes, cap) => tubes.every(t => t.length === 0 || tubeDone(t, cap));

// ---------- solver (weighted A*) ----------
function solve(start, cap, limit = 60000) {
  const key = ts => ts.map(t => t.map(c => String.fromCharCode(97 + c)).join("")).sort().join("|");
  const heur = ts => { let h = 0; for (const t of ts) for (let k = 1; k < t.length; k++) if (t[k] !== t[k - 1]) h++; return h; };
  const heap = []; // [f, id]
  const push = (f, id) => { heap.push([f, id]); let i = heap.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (heap[p][0] <= heap[i][0]) break; [heap[p], heap[i]] = [heap[i], heap[p]]; i = p; } };
  const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let i = 0; for (;;) { let l = 2 * i + 1, r = l + 1, m = i; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === i) break; [heap[m], heap[i]] = [heap[i], heap[m]]; i = m; } } return top; };
  const nodes = [{ ts: start, g: 0, parent: -1, move: null }];
  const best = new Map([[key(start), 0]]);
  push(heur(start) * 2, 0);
  let expanded = 0;
  while (heap.length && expanded++ < limit) {
    const [, id] = pop(), n = nodes[id];
    if (solved(n.ts, cap)) { const path = []; for (let k = id; nodes[k].parent >= 0; k = nodes[k].parent) path.push(nodes[k].move); return path.reverse(); }
    for (let i = 0; i < n.ts.length; i++) {
      const a = n.ts[i]; if (!a.length) continue;
      const uniform = a.every(c => c === a[0]);
      for (let j = 0; j < n.ts.length; j++) {
        const amt = pourAmount(n.ts, i, j, cap); if (!amt) continue;
        if (uniform && n.ts[j].length === 0) continue;               // pointless: moving a pure stack into an empty flask
        const nt = n.ts.map(t => t.slice()), moved = nt[i].splice(nt[i].length - amt, amt); nt[j].push(...moved);
        const k = key(nt), g = n.g + 1;
        if (best.has(k) && best.get(k) <= g) continue;
        best.set(k, g); nodes.push({ ts: nt, g, parent: id, move: [i, j] }); push(g + heur(nt) * 2, nodes.length - 1);
      }
    }
  }
  return null;
}

// ---------- level generation (deterministic per level, always solvable) ----------
function generate(n) {
  const cfg = levelConfig(n);
  let last = null;
  for (let attempt = 0; attempt < 60; attempt++) {
    const r = rng(n * 7919 + attempt * 104729 + 13), units = [];
    for (let c = 0; c < cfg.colors; c++) for (let k = 0; k < cfg.cap; k++) units.push(c);
    for (let i = units.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [units[i], units[j]] = [units[j], units[i]]; }
    const tubes = [];
    for (let i = 0; i < cfg.colors; i++) tubes.push(units.slice(i * cfg.cap, (i + 1) * cfg.cap));
    for (let e = 0; e < cfg.empties; e++) tubes.push([]);
    last = tubes;
    if (solved(tubes, cfg.cap) || (cfg.colors > 3 && tubes.some(t => tubeDone(t, cfg.cap)))) continue;
    const sol = solve(tubes, cfg.cap);
    if (sol) return { tubes, cfg, par: sol.length };
  }
  return { tubes: last, cfg, par: 0 };
}

// ---------- game state ----------
let S = null;
const board = $("board");
let els = [];
function loadLevel(n) {
  const g = generate(n);
  S = { level: n, cap: g.cfg.cap, fog: g.cfg.fog, start: g.tubes.map(t => t.slice()), tubes: g.tubes.map(t => t.slice()), par: g.par,
        history: [], moves: 0, extraUsed: false, sel: null, busy: false, won: false, fresh: {}, hintMove: null };
  store.set("ms-level", n);
  buildBoard(); updateHud();
}
function restart() {
  S.tubes = S.start.map(t => t.slice()); S.history = []; S.moves = 0; S.sel = null; S.fresh = {}; S.won = false; S.hintMove = null;
  buildBoard(); updateHud();
}

// ---------- layout / rendering ----------
function layout() {
  const rc = board.getBoundingClientRect(), n = S.tubes.length, cap = S.cap;
  let bestScore = -1, pick = null;
  for (let rows = 1; rows <= 4; rows++) {
    const perRow = Math.ceil(n / rows), colgap = 10, rowgap = 22;
    const tw = Math.min(64, (rc.width - 6 - (perRow - 1) * colgap) / perRow);
    const lh = Math.min(tw * 0.8, (rc.height - 34 - (rows - 1) * rowgap) / (rows * cap) - 1);
    const score = Math.min(tw, lh / 0.8);
    if (lh > 8 && score > bestScore) { bestScore = score; pick = { rows, perRow, tw, lh, colgap, rowgap }; }
  }
  pick = pick || { rows: 4, perRow: Math.ceil(n / 4), tw: 30, lh: 14, colgap: 8, rowgap: 18 };
  board.style.setProperty("--tw", pick.tw + "px"); board.style.setProperty("--lh", pick.lh + "px");
  board.style.setProperty("--cap", cap); board.style.setProperty("--colgap", pick.colgap + "px"); board.style.setProperty("--rowgap", pick.rowgap + "px");
  board.style.maxWidth = (pick.perRow * (pick.tw + pick.colgap)) + "px";
  board.style.alignContent = "center";
}
function buildBoard() {
  board.replaceChildren(); els = [];
  S.tubes.forEach((_, i) => {
    const d = document.createElement("div"); d.className = "tube"; d.dataset.i = i;
    d.innerHTML = '<div class="liquid"></div>';
    d.addEventListener("pointerdown", () => onTap(i));
    board.append(d); els.push(d);
  });
  $("note").hidden = !S.fog;      // show/hide before measuring, it changes the board height
  layout(); render();
}
function render() {
  const sym = store.get("ms-sym", false);
  S.tubes.forEach((t, i) => {
    const el = els[i], liq = el.firstChild;
    liq.replaceChildren();
    const freshN = S.fresh[i] || 0;
    t.forEach((c, k) => {
      const l = document.createElement("div"); l.className = "layer";
      const isTop = k === t.length - 1;
      if (S.fog && !isTop) { l.classList.add("fog"); l.textContent = "?"; }
      else { l.style.setProperty("--c", COLORS[c]); if (sym) l.textContent = GLYPHS[c]; }
      if (k >= t.length - freshN) l.classList.add("new");
      liq.append(l);
    });
    el.classList.toggle("sel", S.sel === i);
    el.classList.toggle("done", tubeDone(t, S.cap));
  });
  S.fresh = {};
}
function updateHud() {
  $("lvl").textContent = "Level " + S.level;
  $("sub").textContent = `${levelConfig(S.level).colors} colours` + (S.fog ? " · fog" : "") + (S.par ? ` · par ${S.par}` : "");
  $("moves").textContent = S.moves;
  $("undo").disabled = S.busy || !S.history.length;
  $("extra").disabled = S.busy || S.extraUsed;
  $("hint").disabled = S.busy;
}

// ---------- interaction ----------
function onTap(i) {
  if (S.busy || S.won) return;
  clearHint();
  if (S.sel === null) { if (S.tubes[i].length) { S.sel = i; render(); } return; }
  if (S.sel === i) { S.sel = null; render(); return; }
  const from = S.sel, amt = pourAmount(S.tubes, from, i, S.cap);
  if (!amt) {
    els[i].classList.remove("shake"); void els[i].offsetWidth; els[i].classList.add("shake");
    if (S.tubes[i].length) { S.sel = i; render(); }   // switch selection to the tapped flask
    return;
  }
  doPour(from, i);
}
async function doPour(i, j) {
  S.busy = true; updateHud();
  const amt = pourAmount(S.tubes, i, j, S.cap), color = topColor(S.tubes[i]);
  S.sel = null; render();
  await flyPour(i, j, color);
  const moved = S.tubes[i].splice(S.tubes[i].length - amt, amt); S.tubes[j].push(...moved);
  S.history.push({ from: i, to: j, amt, color }); S.moves++; S.fresh = { [j]: amt };
  render(); updateHud();
  await sleep(300);
  els[i].style.transform = ""; els[i].style.zIndex = "";
  await sleep(220);
  document.querySelectorAll(".stream").forEach(s => s.remove());
  if (tubeDone(S.tubes[j], S.cap) && navigator.vibrate) try { navigator.vibrate(25); } catch {}
  S.busy = false; updateHud();
  if (solved(S.tubes, S.cap)) win();
}
async function flyPour(i, j, color) {
  const A = els[i], B = els[j], ra = A.getBoundingClientRect(), rb = B.getBoundingClientRect(), br = board.getBoundingClientRect();
  const dir = rb.left + rb.width / 2 >= ra.left + ra.width / 2 ? 1 : -1, th = dir * 55 * Math.PI / 180, h = ra.height;
  const mxOff = (h / 2) * Math.sin(th), myOff = -(h / 2) * Math.cos(th);
  const mouthX = rb.left + rb.width / 2 - dir * rb.width * 0.18, mouthY = rb.top - 16;
  const dx = mouthX - (ra.left + ra.width / 2) - mxOff, dy = mouthY - (ra.top + ra.height / 2) - myOff - 0;
  A.style.zIndex = 5; A.style.transform = `translate(${dx}px, ${dy}px) rotate(${dir * 55}deg)`;
  await sleep(300);
  const surface = rb.bottom - 3 - S.tubes[j].length * parseFloat(getComputedStyle(board).getPropertyValue("--lh"));
  const st = document.createElement("div"); st.className = "stream"; st.style.background = COLORS[color];
  st.style.left = (mouthX - 3 - br.left) + "px"; st.style.top = (mouthY - br.top) + "px"; st.style.height = Math.max(8, surface - mouthY) + "px";
  board.append(st);
  await sleep(120);
}

// ---------- undo / extra / hint ----------
function undo() {
  if (S.busy || !S.history.length) return;
  const m = S.history.pop(), moved = S.tubes[m.to].splice(S.tubes[m.to].length - m.amt, m.amt);
  S.tubes[m.from].push(...moved); S.moves = Math.max(0, S.moves - 1); S.sel = null; S.won = false; clearHint(); render(); updateHud();
}
function addFlask() {
  if (S.busy || S.extraUsed) return;
  S.extraUsed = true; S.tubes.push([]); S.start.push([]); buildBoard(); updateHud();
}
function clearHint() { document.querySelectorAll(".tube.hint").forEach(e => e.classList.remove("hint")); }
function hint() {
  if (S.busy || S.won) return;
  clearHint();
  const sol = solve(S.tubes.map(t => t.slice()), S.cap);
  if (!sol || !sol.length) { sub("No hint found. Try undo or restart."); return; }
  const [a, b] = sol[0]; els[a].classList.add("hint"); els[b].classList.add("hint");
  setTimeout(clearHint, 2000);
}
function sub(msg) { const s = $("sub"); const old = s.textContent; s.textContent = msg; setTimeout(() => updateHud(), 1800); }

// ---------- win / progress ----------
function progress() { return store.get("ms-progress", { max: 1, stars: {} }); }
function win() {
  S.won = true;
  const par = S.par || S.moves, stars = S.moves <= par * 1.25 + 2 ? 3 : S.moves <= par * 1.8 + 4 ? 2 : 1;
  const p = progress(); p.stars[S.level] = Math.max(p.stars[S.level] || 0, stars); p.max = Math.max(p.max, S.level + 1); store.set("ms-progress", p);
  $("stars").innerHTML = [1, 2, 3].map(i => `<span class="${i <= stars ? "" : "off"}">⭐</span>`).join("");
  $("wintext").textContent = `${S.moves} moves` + (S.par ? ` (par ${S.par})` : "");
  sparkle();
  setTimeout(() => $("win").classList.add("show"), 700);
}
function sparkle() {
  for (let i = 0; i < 18; i++) {
    const s = document.createElement("div"); s.className = "spark"; s.textContent = ["✨", "⭐", "💫"][i % 3];
    s.style.left = (innerWidth / 2) + "px"; s.style.top = (innerHeight / 2.2) + "px";
    s.style.setProperty("--dx", (Math.random() - .5) * innerWidth * 0.9 + "px"); s.style.setProperty("--dy", (Math.random() - .7) * innerHeight * 0.6 + "px");
    document.body.append(s); setTimeout(() => s.remove(), 1200);
  }
}
$("next").onclick = () => { $("win").classList.remove("show"); loadLevel(S.level + 1); };
$("replay").onclick = () => { $("win").classList.remove("show"); restart(); };

// ---------- menu ----------
function showLevels() {
  const p = progress(), grid = $("grid"); grid.replaceChildren();
  const count = Math.max(20, p.max + 5);
  for (let n = 1; n <= count; n++) {
    const b = document.createElement("button"), s = p.stars[n] || 0;
    b.innerHTML = `${n}<small>${s ? "★".repeat(s) : "&nbsp;"}</small>`;
    b.disabled = n > p.max; if (S && n === S.level) b.className = "cur";
    b.onclick = () => { $("levels").classList.remove("show"); loadLevel(n); };
    grid.append(b);
  }
  $("symBtn").textContent = store.get("ms-sym", false) ? "On" : "Off";
  $("levels").classList.add("show");
}
$("menuBtn").onclick = showLevels;
$("closeLevels").onclick = () => $("levels").classList.remove("show");
$("symBtn").onclick = () => { store.set("ms-sym", !store.get("ms-sym", false)); $("symBtn").textContent = store.get("ms-sym", false) ? "On" : "Off"; render(); };
$("resetBtn").onclick = () => { if (confirm("Reset all progress?")) { store.set("ms-progress", { max: 1, stars: {} }); $("levels").classList.remove("show"); loadLevel(1); } };
$("undo").onclick = undo;
$("restart").onclick = () => { if (!S.busy) restart(); };
$("hint").onclick = hint;
$("extra").onclick = addFlask;
addEventListener("resize", () => { if (S) layout(); });

loadLevel(Math.min(store.get("ms-level", 1), progress().max));
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
