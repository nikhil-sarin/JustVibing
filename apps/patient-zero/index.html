<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Patient Zero</title>
<style>
  :root { --bg:#070b1a; --panel:#0f1630; --line:#243059; --text:#e6ebff; --dim:#8a96c4;
    --good:#5dffa0; --bad:#ff5d7a; --gold:#ffd54d; --dna:#7dffb0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:15px/1.25 system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden;
    touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  #app { display:flex; flex-direction:column; height:100%; max-width:620px; margin:0 auto;
    padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom); gap:6px; }
  #hud { display:flex; justify-content:space-between; padding:6px 2px 0; gap:6px; }
  .stat { flex:1; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:5px 4px; text-align:center; }
  .stat small { display:block; color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.05em; }
  .stat b { font-size:16px; font-variant-numeric:tabular-nums; }
  #dna { color:var(--dna); } #dead { color:var(--bad); } #inf { color:#ff9d4d; }
  #cure { position:relative; height:22px; background:var(--panel); border:1px solid var(--line); border-radius:99px; overflow:hidden; }
  #curefill { position:absolute; inset:0 auto 0 0; width:0; background:linear-gradient(90deg,#2a6bff,#7dd3ff); transition:width .3s; }
  #curetxt { position:relative; display:block; text-align:center; font-size:12px; line-height:20px; font-weight:600; }
  #stage { position:relative; flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; border-radius:12px; border:1px solid var(--line); background:#050818; }
  #card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:7px 10px; min-height:62px; font-size:13px; color:var(--dim); }
  #card b { color:var(--text); font-size:14px; } #card .news { color:var(--text); }
  #card .sub { margin-top:3px; }
  .row { display:flex; gap:6px; padding-bottom:6px; }
  button { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:8px 10px; min-height:50px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  button small { color:var(--dim); font-size:12px; }
  button:disabled { opacity:.4; }
  #evoBtn { flex:2; background:#12392a; border-color:#2c7a55; } #evoBtn b { color:var(--dna); }
  #speed { flex:1; } #menu { flex:0 0 52px; padding:0; font-size:18px; }
  .overlay { position:fixed; inset:0; z-index:10; background:#050818; display:none; overflow:auto;
    padding:max(16px,env(safe-area-inset-top)) 16px 24px; }
  .overlay.show { display:block; }
  .inner { max-width:560px; margin:0 auto; }
  h1 { margin:10px 0 2px; font-size:28px; } p.sub2 { color:var(--dim); margin:0 0 16px; }
  .type { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; cursor:pointer; }
  .type:active { background:#1a2350; } .type h2 { margin:0 0 4px; font-size:18px; } .type p { margin:0; color:var(--dim); font-size:14px; }
  .diffrow { display:flex; align-items:center; gap:10px; margin-bottom:14px; color:var(--dim); } .diffrow .tabs { flex:1; }
  a.back { color:var(--dim); text-decoration:none; font-size:14px; }
  #evohead { position:sticky; top:-16px; background:#050818; padding:10px 0 8px; z-index:2; }
  #evohead .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  #evohead .top b { color:var(--dna); font-size:20px; }
  #evohead .top button { min-height:38px; flex:none; padding:4px 14px; }
  .tabs { display:flex; gap:6px; } .tabs button { flex:1; min-height:38px; font-size:13px; padding:4px 2px; }
  .tabs button.on { background:#1a2350; outline:2px solid var(--text); }
  #traits { margin-top:8px; display:grid; gap:8px; }
  .trait { flex-direction:row; justify-content:space-between; text-align:left; gap:10px; padding:10px 12px; width:100%; }
  .trait .l b { display:block; font-size:15px; } .trait .l small { font-size:12.5px; }
  .trait .cost { font-weight:700; color:var(--dna); white-space:nowrap; }
  .trait.owned { background:#12392a; border-color:#2c7a55; } .trait.owned .cost { color:var(--good); }
  .trait.locked { opacity:.4; } .trait.poor .cost { color:var(--bad); }
  #end h1.win { color:var(--good); } #end h1.lose { color:var(--bad); }
  #end .stats { color:var(--dim); margin:8px 0 18px; line-height:1.6; }
  #end button { width:100%; margin-bottom:10px; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stat"><small>DNA</small><b id="dna">0</b></div>
    <div class="stat"><small>Day</small><b id="day">0</b></div>
    <div class="stat"><small>Infected</small><b id="inf">0</b></div>
    <div class="stat"><small>Dead</small><b id="dead">0</b></div>
  </div>
  <div id="cure"><div id="curefill"></div><span id="curetxt">Cure: not started</span></div>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="card"></div>
  <div class="row">
    <button id="evoBtn"><b>🧬 Evolve</b><small id="evoSmall"></small></button>
    <button id="speed"><b>▶ 1×</b></button>
    <button id="menu" title="New game">☰</button>
  </div>
</div>

<div id="start" class="overlay show"><div class="inner">
  <a class="back" href="../../">← All apps</a>
  <h1>Patient Zero</h1>
  <p class="sub2">Evolve a pathogen. Infect the world. Wipe out humanity before they find a cure.</p>
  <div class="diffrow"><span>Difficulty</span><div class="tabs" id="diffs"></div></div>
  <div id="types"></div>
</div></div>

<div id="evolve" class="overlay"><div class="inner">
  <div id="evohead">
    <div class="top"><span>DNA <b id="evodna">0</b></span><button id="evoclose">Close</button></div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div id="traits"></div>
</div></div>

<div id="end" class="overlay"><div class="inner">
  <h1 id="endtitle"></h1><div id="endtext" class="stats"></div>
  <button id="again"><b>Play again</b></button>
</div></div>

<script>
"use strict";
// ---------- data ----------
// id, name, short, x, y (map units, 100×112), population (millions), wealth 1-5, climate, airport, port
const REG = [
  ["nam","Northern America","N. America",16,16,40,5,"cold",1,1],
  ["usa","United States","USA",22,34,330,5,"temp",1,1],
  ["cam","Central America","C. America",22,52,180,3,"hot",1,1],
  ["bra","Brazil & North","Brazil",36,70,215,3,"hot",1,1],
  ["sco","Southern Cone","S. Cone",30,94,110,3,"temp",1,1],
  ["weu","Western Europe","W. Europe",46,28,300,5,"temp",1,1],
  ["eeu","Eastern Europe","E. Europe",60,26,180,3,"cold",1,1],
  ["rus","Russia","Russia",78,14,145,3,"cold",1,1],
  ["naf","North Africa","N. Africa",48,48,250,2,"hot",1,1],
  ["mea","Middle East","Mid. East",66,44,400,3,"hot",1,1],
  ["cas","Central Asia","C. Asia",80,32,80,2,"cold",0,0],
  ["ssa","Sub-Saharan Africa","Africa",50,70,900,1,"hot",1,1],
  ["saf","Southern Africa","S. Africa",56,94,170,2,"hot",1,1],
  ["ind","India","India",72,64,1400,2,"hot",1,1],
  ["chn","China","China",90,44,1450,3,"temp",1,1],
  ["sea","Southeast Asia","SE Asia",88,68,680,2,"hot",1,1],
  ["oce","Oceania","Oceania",88,100,45,5,"temp",1,1],
  ["jpk","Japan & Korea","Japan",92,24,175,5,"temp",1,1],
];
const LAND = [["nam","usa"],["usa","cam"],["cam","bra"],["bra","sco"],["weu","eeu"],["weu","naf"],["eeu","rus"],["eeu","mea"],
  ["eeu","cas"],["rus","cas"],["cas","chn"],["cas","mea"],["cas","ind"],["mea","naf"],["mea","ind"],["naf","ssa"],["ssa","saf"],
  ["chn","ind"],["chn","sea"],["ind","sea"],["rus","chn"]];
const SEA = [["usa","weu"],["bra","ssa"],["sco","saf"],["sea","oce"],["chn","jpk"],["usa","jpk"],["saf","oce"],["ind","ssa"],
  ["rus","jpk"],["mea","ssa"],["nam","weu"],["cam","ssa"]];

const TYPES = {
  bacteria: { name: "Bacteria", beta: 1.0,  cure: 1.0,  drug: 1, mutate: false, desc: "Hardy and balanced. Starts with a little drug resistance. Good first pick." },
  virus:    { name: "Virus",    beta: 1.1,  cure: 1.0,  drug: 0, mutate: true,  desc: "Spreads faster, but mutates: it keeps gaining random mild symptoms, which makes it easier to detect." },
  fungus:   { name: "Fungus",   beta: 0.88, cure: 0.72, drug: 0, mutate: false, desc: "Slow and stealthy. Spreads more slowly but the cure takes much longer to develop." },
};
const TRAITS = {
  air1:   { tab: "Transmission", name: "Aerosol",       desc: "Spreads by air travel. +1 infectivity.",       cost: 12, fx: { air: 1, inf: 1 } },
  air2:   { tab: "Transmission", name: "Aerosol II",    desc: "+2 infectivity.",                               cost: 25, req: "air1", fx: { inf: 2 } },
  sea1:   { tab: "Transmission", name: "Waterborne",    desc: "Spreads on ships between ports. +1 infectivity.", cost: 12, fx: { sea: 1, inf: 1 } },
  sea2:   { tab: "Transmission", name: "Waterborne II", desc: "+2 infectivity.",                               cost: 25, req: "sea1", fx: { inf: 2 } },
  insect: { tab: "Transmission", name: "Insect vectors", desc: "Carried by insects. +2 infectivity.",          cost: 15, fx: { inf: 2 } },
  rodent: { tab: "Transmission", name: "Rodent vectors", desc: "Carried by rats. +2 infectivity, helps in the cold.", cost: 15, fx: { inf: 2, cold: 0.5 } },
  cough:  { tab: "Symptoms", name: "Coughing",  desc: "+1 infectivity, +1 severity.",           cost: 8,  fx: { inf: 1, sev: 1 } },
  sneeze: { tab: "Symptoms", name: "Sneezing",  desc: "+2 infectivity, +1 severity.",           cost: 15, req: "cough", fx: { inf: 2, sev: 1 } },
  fever:  { tab: "Symptoms", name: "Fever",     desc: "+1 infectivity, +2 severity.",           cost: 10, fx: { inf: 1, sev: 2 } },
  nausea: { tab: "Symptoms", name: "Nausea",    desc: "+1 infectivity, +1 severity.",           cost: 8,  fx: { inf: 1, sev: 1 } },
  rash:   { tab: "Symptoms", name: "Rash",      desc: "+1 infectivity, +1 severity.",           cost: 8,  fx: { inf: 1, sev: 1 } },
  pneu:   { tab: "Symptoms", name: "Pneumonia", desc: "Lungs fill with fluid. Lethal: +2.",     cost: 20, req: "cough", fx: { inf: 1, sev: 2, leth: 2 } },
  hemo:   { tab: "Symptoms", name: "Haemorrhaging", desc: "Lethal: +4. Hard to ignore.",        cost: 30, req: "fever", fx: { sev: 3, leth: 4 } },
  organ:  { tab: "Symptoms", name: "Organ failure", desc: "Lethal: +6.",                        cost: 45, req: "pneu", fx: { sev: 3, leth: 6 } },
  necro:  { tab: "Symptoms", name: "Necrosis",  desc: "Lethal: +10.",                            cost: 60, req: "hemo", fx: { sev: 4, leth: 10 } },
  total:  { tab: "Symptoms", name: "Total organ failure", desc: "Lethal: +14. The end.",         cost: 90, req: "organ", fx: { sev: 5, leth: 14 } },
  bird:   { tab: "Transmission", name: "Bird migration", desc: "Birds carry you along flight paths. +1 infectivity, faster air spread.", cost: 18, req: "air1", fx: { inf: 1, airBoost: 1 } },
  water2: { tab: "Transmission", name: "Contaminated water", desc: "+2 infectivity, faster sea spread.", cost: 28, req: "sea1", fx: { inf: 2, seaBoost: 1 } },
  livestk:{ tab: "Transmission", name: "Livestock", desc: "Farm animals carry it. +2 infectivity.", cost: 18, fx: { inf: 2 } },
  blood:  { tab: "Transmission", name: "Blood-borne", desc: "+3 infectivity, +1 severity.", cost: 28, req: "insect", fx: { inf: 3, sev: 1 } },
  saliva: { tab: "Transmission", name: "Saliva", desc: "+2 infectivity.", cost: 14, req: "cough", fx: { inf: 2 } },
  sweat:  { tab: "Symptoms", name: "Sweating",  desc: "+1 infectivity, +1 severity.",           cost: 8,  fx: { inf: 1, sev: 1 } },
  insom:  { tab: "Symptoms", name: "Insomnia",  desc: "+1 infectivity, +1 severity.",           cost: 8,  fx: { inf: 1, sev: 1 } },
  vomit:  { tab: "Symptoms", name: "Vomiting",  desc: "+2 infectivity, +2 severity.",           cost: 16, req: "nausea", fx: { inf: 2, sev: 2 } },
  diarr:  { tab: "Symptoms", name: "Diarrhoea", desc: "+2 infectivity, +1 severity.",           cost: 14, req: "nausea", fx: { inf: 2, sev: 1 } },
  cysts:  { tab: "Symptoms", name: "Cysts",     desc: "+1 infectivity, +1 severity.",           cost: 10, req: "rash", fx: { inf: 1, sev: 1 } },
  seizure:{ tab: "Symptoms", name: "Seizures",  desc: "Lethal: +3.",                            cost: 25, req: "fever", fx: { sev: 3, leth: 3 } },
  sepsis: { tab: "Symptoms", name: "Sepsis",    desc: "Lethal: +5.",                            cost: 35, req: "vomit", fx: { sev: 3, leth: 5 } },
  paral:  { tab: "Symptoms", name: "Paralysis", desc: "Lethal: +8.",                            cost: 50, req: "seizure", fx: { sev: 4, leth: 8 } },
  coma:   { tab: "Symptoms", name: "Coma",      desc: "Lethal: +12.",                           cost: 70, req: "paral", fx: { sev: 4, leth: 12 } },
  stealth1:{ tab: "Abilities", name: "Symptom suppression", desc: "Hides symptoms: humans notice you 30% less.", cost: 25, fx: { stealth: 1 } },
  stealth2:{ tab: "Abilities", name: "Symptom suppression II", desc: "Humans notice you 30% less again.", cost: 40, req: "stealth1", fx: { stealth: 1 } },
  genet1: { tab: "Abilities", name: "Genetic engineering", desc: "Every DNA bubble gives +1 extra.", cost: 30, fx: { dnaBonus: 1 } },
  genet2: { tab: "Abilities", name: "Genetic engineering II", desc: "Every DNA bubble gives another +1.", cost: 55, req: "genet1", fx: { dnaBonus: 1 } },
  envhard:{ tab: "Abilities", name: "Environmental hardening", desc: "Better in both cold and hot regions.", cost: 22, fx: { cold: 0.5, heat: 0.5 } },
  // pathogen-specific
  v_rep:  { tab: "Special", only: "virus", name: "Rapid replication", desc: "Virus only. +3 infectivity.", cost: 20, fx: { inf: 3 } },
  v_shift:{ tab: "Special", only: "virus", name: "Antigenic shift", desc: "Virus only. Slows cure research by 18%.", cost: 35, fx: { drug: 2 } },
  v_lat:  { tab: "Special", only: "virus", name: "Latency", desc: "Virus only. Lies dormant: humans notice you 40% less.", cost: 30, fx: { stealth: 1.4 } },
  v_mut:  { tab: "Special", only: "virus", name: "Hypermutation", desc: "Virus only. Mutates twice as often (mild symptoms).", cost: 25, fx: { hyper: 1 } },
  v_cap:  { tab: "Special", only: "virus", name: "Envelope protein", desc: "Virus only. +2 infectivity, ignores rich countries' hygiene.", cost: 30, fx: { inf: 2, hard: 1 } },
  b_spore:{ tab: "Special", only: "bacteria", name: "Spore formation", desc: "Bacteria only. Resists both cold and heat.", cost: 18, fx: { cold: 1, heat: 1 } },
  b_film: { tab: "Special", only: "bacteria", name: "Biofilm", desc: "Bacteria only. Slows cure research by 18%.", cost: 30, fx: { drug: 2 } },
  b_toxin:{ tab: "Special", only: "bacteria", name: "Toxins", desc: "Bacteria only. Lethal +4, severity +2.", cost: 28, fx: { sev: 2, leth: 4 } },
  b_dup:  { tab: "Special", only: "bacteria", name: "Binary fission", desc: "Bacteria only. +3 infectivity.", cost: 22, fx: { inf: 3 } },
  f_bloom:{ tab: "Special", only: "fungus", name: "Spore bloom", desc: "Fungus only. +3 infectivity.", cost: 18, fx: { inf: 3 } },
  f_dorm: { tab: "Special", only: "fungus", name: "Dormancy", desc: "Fungus only. Humans notice you 45% less.", cost: 25, fx: { stealth: 1.5 } },
  f_myco: { tab: "Special", only: "fungus", name: "Mycotoxins", desc: "Fungus only. Lethal +5, severity +2.", cost: 30, fx: { sev: 2, leth: 5 } },
  f_net:  { tab: "Special", only: "fungus", name: "Mycelial network", desc: "Fungus only. +2 infectivity, faster land spread.", cost: 22, fx: { inf: 2, landBoost: 1 } },
  cold:   { tab: "Abilities", name: "Cold resistance", desc: "Thrives in cold regions.",         cost: 15, fx: { cold: 1 } },
  heat:   { tab: "Abilities", name: "Heat resistance", desc: "Thrives in hot regions.",          cost: 15, fx: { heat: 1 } },
  drug1:  { tab: "Abilities", name: "Drug resistance",   desc: "Slows cure research by 9%.",     cost: 20, fx: { drug: 1 } },
  drug2:  { tab: "Abilities", name: "Drug resistance II", desc: "Slows cure research by 9% more.", cost: 30, req: "drug1", fx: { drug: 1 } },
  drug3:  { tab: "Abilities", name: "Drug resistance III", desc: "Slows cure research by 9% more.", cost: 45, req: "drug2", fx: { drug: 1 } },
  hard:   { tab: "Abilities", name: "Hardened spores", desc: "Rich countries' hygiene no longer slows you.", cost: 25, fx: { hard: 1 } },
};
const DIFF = {
  easy:   { label: "Easy",   dna: 1.6, cure: 1.15, startI: 3000, startDna: 16 },
  normal: { label: "Normal", dna: 1.0, cure: 1.8,  startI: 500,  startDna: 10 },
  hard:   { label: "Hard",   dna: 0.7, cure: 2.5,  startI: 1,    startDna: 8 },
};
const TABS = ["Transmission", "Symptoms", "Abilities", "Special"];
const TAB_LABEL = { Transmission: "Spread", Symptoms: "Symptoms", Abilities: "Abilities", Special: "Special" };

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const cv = $("c"), ctx = cv.getContext("2d");
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const fmt = n => n >= 1e9 ? (n / 1e9).toFixed(2) + "B" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "K" : Math.round(n) + "";
const MAPH = 112;   // map is 100 × 112 units
const radius = r => 2.6 + Math.sqrt(r.popM) * 0.15;

// ---------- state ----------
let S = null, tab = "Transmission", selected = null, last = performance.now(), acc = 0;
const regionById = {};
const landN = {}, seaN = {};

function newGame(type) {
  const T = TYPES[type];
  const diff = store.get("pz-diff", "easy");
  S = { type, diff: DIFF[diff] ? diff : "easy", day: 0, dna: DIFF[DIFF[diff] ? diff : "easy"].startDna, started: false, over: false, speed: 1, cure: 0, detected: false,
        owned: new Set(), dnaAcc: 0, st: null, bubbles: [], fx: [], news: [], flags: {}, nextMutation: 25, R: [] };
  for (const k in landN) delete landN[k]; for (const k in seaN) delete seaN[k];
  S.R = REG.map(([id, name, short, x, y, popM, w, cl, air, sea]) => {
    const r = { id, name, short, x, y, popM, w, cl, air, sea, N: popM * 1e6, I: 0, D: 0, airClosed: false, landClosed: false,
      verts: Array.from({ length: 14 }, (_, i) => ({ a: i / 14 * 6.283, k: 0.84 + Math.random() * 0.32 })) };
    regionById[id] = r; landN[id] = []; seaN[id] = []; return r;
  });
  for (const [a, b] of LAND) { landN[a].push(regionById[b]); landN[b].push(regionById[a]); }
  for (const [a, b] of SEA) { seaN[a].push(regionById[b]); seaN[b].push(regionById[a]); }
  selected = null; calc(); say("Tap a region to place Patient Zero.");
  $("start").classList.remove("show"); $("end").classList.remove("show"); $("evolve").classList.remove("show");
  S.speed = 1; ui();
}
function calc() {
  const T = TYPES[S.type], s = { inf: 0, sev: 0, leth: 0, drug: T.drug, cold: 0, heat: 0, air: 0, sea: 0, hard: 0, airBoost: 0, seaBoost: 0, landBoost: 0, stealth: 0, dnaBonus: 0, hyper: 0 };
  for (const id of S.owned) for (const k in TRAITS[id].fx) s[k] += TRAITS[id].fx[k];
  s.air = Math.min(1, s.air); s.sea = Math.min(1, s.sea); S.st = s;
}
function say(msg) { S.news.unshift(msg); if (S.news.length > 30) S.news.pop(); renderCard(); }

// ---------- simulation (one tick = one day) ----------
function seed(dst, how, src) {
  if (dst.I > 0 || dst.D >= dst.N || S.flags["wiped" + dst.id]) return;
  dst.I = 1; S.dna += Math.round(5 * DIFF[S.diff].dna);
  say(`Infection reaches ${dst.name}${src ? " by " + how + " from " + src.short : ""}.`);
  if (how === "air" && src) S.fx.push({ x1: src.x, y1: src.y, x2: dst.x, y2: dst.y, t: 0, dur: 1.2, c: "#fff" });
  if (how === "sea" && src) S.fx.push({ x1: src.x, y1: src.y, x2: dst.x, y2: dst.y, t: 0, dur: 1.8, c: "#7dd3ff" });
}
function tickDay() {
  const st = S.st, T = TYPES[S.type];
  S.day++;
  let wN = 0, wI = 0, wD = 0, infRegions = 0;
  for (const r of S.R) {
    if (r.I > 0) {
      const heal = Math.max(0, r.N - r.I - r.D);
      let clim = 1;
      if (r.cl === "cold") clim = Math.min(1.15, 0.6 + 0.5 * st.cold);
      else if (r.cl === "hot") clim = Math.min(1.15, 0.7 + 0.45 * st.heat);
      const wealth = st.hard ? 1 : 1.25 - 0.09 * r.w;
      const beta = (0.095 + 0.015 * st.inf) * clim * wealth * T.beta;
      // floor on growth so the last small pockets of healthy people still get infected (mop-up phase)
      const living = Math.max(1, r.N - r.D);   // transmission depends on the living population, not the dead
      r.I += Math.min(heal, Math.max(beta * r.I * heal / living, beta * r.I * 0.03));
      // lethality ramps in as the region fills up, so a small early outbreak can't be killed off before it spreads
      const dd = Math.min(r.I, r.I * st.leth * 0.0035 * Math.min(1, r.I / Math.max(1, r.N - r.D) * 8));
      r.I -= dd; r.D += dd;
      if (dd > 0 && !S.flags.firstDeath) { S.flags.firstDeath = 1; say(`First deaths reported in ${r.name}.`); }
      if (r.N - r.D < 200) { r.D = r.N; r.I = 0; if (!S.flags["wiped" + r.id]) { S.flags["wiped" + r.id] = 1; say(`${r.name} has been wiped out.`); } }
    }
    wN += r.N; wI += r.I; wD += r.D; if (r.I >= 1) infRegions++;
  }

  // spread
  for (const r of S.R) if (r.I >= 1) {
    for (const n of landN[r.id]) if (!r.landClosed && !n.landClosed && Math.random() < 1 - Math.exp(-r.I / 2e5 * (1 + 0.6 * st.landBoost))) seed(n, "land", r);
    if (st.air && r.air && !r.airClosed && Math.random() < 1 - Math.exp(-r.I / 1.5e6 * (1 + 0.6 * st.airBoost))) {
      const opts = S.R.filter(o => o !== r && o.air && !o.airClosed);
      if (opts.length) seed(opts[Math.random() * opts.length | 0], "air", r);
    }
    if (st.sea && r.sea) for (const n of seaN[r.id]) if (n.sea && Math.random() < 1 - Math.exp(-r.I / 2.5e6 * (1 + 0.6 * st.seaBoost))) seed(n, "sea", r);
  }

  // detection and cure
  const infFrac = wI / wN, deadFrac = wD / wN, effSev = st.sev * Math.max(0.2, 1 - 0.3 * st.stealth);
  if (!S.detected && (wD > 10000 || (effSev >= 5 && wI > 50000) || infFrac > 0.05)) {
    S.detected = true; say("Scientists have identified a new pathogen. Cure research begins.");
  }
  const aware = S.detected ? Math.min(1, infFrac * 1.5 + deadFrac * 3 + effSev * 0.015) : 0;
  if (S.detected) {
    let rs = 0, rw = 0;
    for (const r of S.R) { rs += r.w * (r.N - r.D) / r.N; rw += r.w; }
    S.cure = Math.min(1, S.cure + 0.0022 * (rs / rw) * (0.4 + 2.6 * aware) * Math.max(0.3, 1 - 0.09 * st.drug) * T.cure * DIFF[S.diff].cure);
    for (const m of [0.25, 0.5, 0.75, 0.9]) if (S.cure >= m && !S.flags["cure" + m]) { S.flags["cure" + m] = 1; say(`Cure research is ${m * 100}% complete!`); }
  }
  for (const r of S.R) {
    const f = r.I / r.N;
    const air = S.detected && aware > 0.35 && f > 0.02, land = S.detected && aware > 0.65 && f > 0.12;
    if (air && !r.airClosed) say(`${r.name} closes its airports.`);
    if (land && !r.landClosed) say(`${r.name} closes its borders.`);
    r.airClosed = r.airClosed || air; r.landClosed = r.landClosed || land;
  }

  // DNA bubbles
  if (infRegions > 0) { S.dna += (0.1 + 0.02 * infRegions) * DIFF[S.diff].dna; }   // slow passive DNA trickle
  if (infRegions > 0 && Math.random() < Math.min(0.9, 0.38 + 0.05 * infRegions)) {
    const pool = S.R.filter(r => r.I >= 1), r = pool[Math.random() * pool.length | 0], big = Math.random() < 0.15;
    S.bubbles.push({ x: r.x + (Math.random() - .5) * radius(r), y: r.y + (Math.random() - .5) * radius(r), v: Math.max(1, Math.round((big ? 5 : 1 + (Math.random() * 2 | 0)) * DIFF[S.diff].dna)), ttl: 14, big });
  }

  // virus mutation
  if (T.mutate && S.day >= S.nextMutation) {
    S.nextMutation = S.day + (22 + (Math.random() * 12 | 0)) / (st.hyper ? 2 : 1);
    const opts = Object.keys(TRAITS).filter(k => TRAITS[k].tab === "Symptoms" && !TRAITS[k].fx.leth && !S.owned.has(k) && (!TRAITS[k].req || S.owned.has(TRAITS[k].req)));
    if (opts.length) { const k = opts[Math.random() * opts.length | 0]; S.owned.add(k); calc(); say(`Mutation! Your virus gained ${TRAITS[k].name}.`); }
  }

  S.totals = { N: wN, I: wI, D: wD };
  if (wN - wD < 1000) return finish(true);
  if (S.cure >= 1) return finish(false, "Humanity developed a cure.");
  if (wI < 1) return finish(false, "The pathogen died out.");
}
function finish(win, why) {
  S.over = true; S.speed = 0;
  const T = S.totals;
  if (win) { const best = store.get("pz-best", 0); if (!best || S.day < best) store.set("pz-best", S.day); }
  $("endtitle").textContent = win ? "Humanity is extinct" : "You lost"; $("endtitle").className = win ? "win" : "lose";
  $("endtext").innerHTML = `${win ? "The planet is yours." : why}<br>Pathogen: ${TYPES[S.type].name} · Day ${S.day}<br>Infected: ${fmt(T.I)} · Dead: ${fmt(T.D)} of ${fmt(T.N)}<br>Cure progress: ${Math.round(S.cure * 100)}%` +
    (store.get("pz-best", 0) ? `<br>Fastest win: day ${store.get("pz-best", 0)}` : "");
  $("end").classList.add("show"); ui();
}

// ---------- ui ----------
function ui() {
  const T = S.totals || { N: 1, I: 0, D: 0 };
  $("dna").textContent = Math.floor(S.dna); $("day").textContent = S.day;
  $("inf").textContent = fmt(T.I); $("dead").textContent = fmt(T.D);
  $("curefill").style.width = (S.cure * 100) + "%";
  $("curetxt").textContent = S.detected ? `Cure ${(S.cure * 100).toFixed(1)}%` : "Cure: not started (undetected)";
  const afford = Object.keys(TRAITS).filter(k => canBuy(k) && TRAITS[k].cost <= S.dna).length;
  $("evoSmall").textContent = afford ? `${afford} available` : "save DNA";
  $("speed").querySelector("b").textContent = S.speed === 0 ? "⏸ paused" : "▶ " + S.speed + "×";
  $("evodna").textContent = Math.floor(S.dna);
}
function renderCard() {
  const el = $("card");
  let html = `<div class="news">${S.news[0] || ""}</div>`;
  if (selected) {
    const r = selected, f = r.I / r.N;
    html = `<b>${r.name}</b> · pop ${fmt(r.N)} · wealth ${"★".repeat(r.w)}<br>🦠 ${fmt(r.I)} (${(f * 100).toFixed(f < .01 ? 2 : 0)}%) · ☠ ${fmt(r.D)}` +
      `${r.airClosed ? " · ✈ closed" : ""}${r.landClosed ? " · 🚧 borders closed" : ""}<div class="sub">${S.news[0] || ""}</div>`;
  }
  el.innerHTML = html;
}
const visible = k => !TRAITS[k].only || TRAITS[k].only === S.type;
function canBuy(k) { const t = TRAITS[k]; return visible(k) && !S.owned.has(k) && (!t.req || S.owned.has(t.req)); }
function renderEvolve() {
  const tabs = $("tabs"); tabs.replaceChildren();
  for (const t of TABS) { const b = document.createElement("button"); b.textContent = TAB_LABEL[t]; b.className = t === tab ? "on" : ""; b.onclick = () => { tab = t; renderEvolve(); }; tabs.append(b); }
  const list = $("traits"); list.replaceChildren();
  for (const [id, t] of Object.entries(TRAITS)) {
    if (t.tab !== tab || !visible(id)) continue;
    const b = document.createElement("button"); b.className = "trait";
    const owned = S.owned.has(id), locked = t.req && !S.owned.has(t.req), poor = !owned && !locked && S.dna < t.cost;
    if (owned) b.classList.add("owned"); if (locked) b.classList.add("locked"); if (poor) b.classList.add("poor");
    b.innerHTML = `<span class="l"><b>${t.name}</b><small>${locked ? "Requires " + TRAITS[t.req].name + ". " : ""}${t.desc}</small></span><span class="cost">${owned ? "✓" : "🧬 " + t.cost}</span>`;
    b.onclick = () => { if (owned || locked || poor) return; S.dna -= t.cost; S.owned.add(id); calc(); renderEvolve(); ui(); };
    list.append(b);
  }
  $("evodna").textContent = Math.floor(S.dna);
}

$("evoBtn").onclick = () => { renderEvolve(); $("evolve").classList.add("show"); };
$("evoclose").onclick = () => $("evolve").classList.remove("show");
$("speed").onclick = () => { if (S.over) return; const seq = [1, 2, 4, 0]; S.speed = seq[(seq.indexOf(S.speed) + 1) % seq.length]; ui(); };
$("menu").onclick = () => { if (S.started && !S.over && !confirm("Abandon this outbreak and start over?")) return; showStart(); };
$("again").onclick = showStart;
function renderDiffs() {
  const cur = store.get("pz-diff", "easy"), box = $("diffs"); box.replaceChildren();
  for (const [k, d] of Object.entries(DIFF)) {
    const b = document.createElement("button"); b.textContent = d.label; b.className = k === cur ? "on" : "";
    b.onclick = () => { store.set("pz-diff", k); renderDiffs(); }; box.append(b);
  }
}
function showStart() {
  renderDiffs();
  const box = $("types"); box.replaceChildren();
  for (const [k, t] of Object.entries(TYPES)) {
    const d = document.createElement("div"); d.className = "type";
    d.innerHTML = `<h2>${t.name}</h2><p>${t.desc}</p>`; d.onclick = () => newGame(k); box.append(d);
  }
  $("end").classList.remove("show"); $("evolve").classList.add("show"); $("evolve").classList.remove("show");
  $("start").classList.add("show");
}

// ---------- input ----------
cv.addEventListener("pointerdown", ev => {
  if (S.over) return;
  const rc = cv.getBoundingClientRect(), x = (ev.clientX - rc.left) / rc.width * 100, y = (ev.clientY - rc.top) / rc.height * MAPH;
  for (let i = S.bubbles.length - 1; i >= 0; i--) {
    const b = S.bubbles[i];
    if (Math.hypot(b.x - x, b.y - y) < (b.big ? 5.5 : 4.6)) { S.dna += b.v + S.st.dnaBonus; S.bubbles.splice(i, 1); if (navigator.vibrate) try { navigator.vibrate(15); } catch {} ui(); return; }
  }
  let best = null, bd = 1e9;
  for (const r of S.R) { const d = Math.hypot(r.x - x, r.y - y) - radius(r); if (d < bd) { bd = d; best = r; } }
  if (!best || bd > 2) { selected = null; renderCard(); return; }
  if (!S.started) {
    S.started = true; best.I = DIFF[S.diff].startI; selected = best; say(`Patient Zero: ${best.name}. The outbreak begins.`);
  } else selected = best;
  renderCard(); ui();
});

// ---------- rendering ----------
let scale = 4;
function resize() {
  const st = $("stage").getBoundingClientRect();
  scale = Math.max(2, Math.min((st.width - 2) / 100, (st.height - 2) / MAPH));
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = scale * 100 + "px"; cv.style.height = scale * MAPH + "px";
  cv.width = Math.round(scale * 100 * dpr); cv.height = Math.round(scale * MAPH * dpr);
}
addEventListener("resize", resize);
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
function regionColor(r) {
  let c = mix([30, 72, 128], [255, 70, 90], Math.min(1, r.I / r.N * 1.4 + (r.I >= 1 ? 0.12 : 0)));
  c = mix(c, [26, 26, 34], Math.min(1, r.D / r.N * 1.1));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function draw(now) {
  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.clearRect(0, 0, 100, MAPH);
  // links
  ctx.lineWidth = 0.35;
  for (const [a, b] of LAND) { const A = regionById[a], B = regionById[b]; ctx.strokeStyle = A.landClosed || B.landClosed ? "#ff5d7a66" : "#33427f"; ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke(); }
  if (S.st.sea) { ctx.setLineDash([1, 1.2]); ctx.strokeStyle = "#2a5a8f"; for (const [a, b] of SEA) { const A = regionById[a], B = regionById[b]; if (A.sea && B.sea) { ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke(); } } ctx.setLineDash([]); }
  // regions
  for (const r of S.R) {
    const rad = radius(r);
    ctx.beginPath();
    r.verts.forEach((v, i) => { const px = r.x + Math.cos(v.a) * rad * v.k, py = r.y + Math.sin(v.a) * rad * v.k; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
    ctx.closePath(); ctx.fillStyle = regionColor(r); ctx.fill();
    ctx.strokeStyle = r === selected ? "#fff" : r.I >= 1 ? "#ff8aa0" : "#4a5ea0"; ctx.lineWidth = r === selected ? 0.7 : 0.35; ctx.stroke();
    if (r.I >= 1) { ctx.globalAlpha = 0.25 + 0.2 * Math.sin(now / 300 + r.x); ctx.strokeStyle = "#ff5d7a"; ctx.lineWidth = 0.5; ctx.beginPath(); ctx.arc(r.x, r.y, rad * 1.18, 0, 6.283); ctx.stroke(); ctx.globalAlpha = 1; }
    ctx.fillStyle = "#e6ebff"; ctx.font = "2.7px system-ui"; ctx.textAlign = "center"; ctx.fillText(r.short, r.x, r.y + rad + 3.4);
    if (r.airClosed) { ctx.font = "3px system-ui"; ctx.fillText("✈", r.x - 1.6, r.y + 1); ctx.fillStyle = "#ff5d7a"; ctx.fillText("✖", r.x + 1.6, r.y + 1); }
  }
  // planes / ships
  for (const f of S.fx) {
    const t = Math.min(1, f.t / f.dur), x = f.x1 + (f.x2 - f.x1) * t, y = f.y1 + (f.y2 - f.y1) * t - Math.sin(t * Math.PI) * 3;
    ctx.fillStyle = f.c; ctx.beginPath(); ctx.arc(x, y, 0.9, 0, 6.283); ctx.fill();
  }
  // DNA bubbles
  for (const b of S.bubbles) {
    const wob = Math.sin(now / 250 + b.x) * 0.5, rr = b.big ? 3.2 : 2.5;
    ctx.globalAlpha = Math.min(1, b.ttl / 2);
    ctx.fillStyle = b.big ? "#ffd54dcc" : "#7dffb0cc"; ctx.beginPath(); ctx.arc(b.x, b.y + wob, rr, 0, 6.283); ctx.fill();
    ctx.strokeStyle = "#fff8"; ctx.lineWidth = 0.3; ctx.stroke();
    ctx.fillStyle = "#06240f"; ctx.font = "bold 2.6px system-ui"; ctx.textAlign = "center"; ctx.fillText("+" + b.v, b.x, b.y + wob + 0.95);
    ctx.globalAlpha = 1;
  }
}

function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (S && !S.over && S.started && S.speed && !document.hidden) {
    acc += dt * S.speed;
    while (acc >= 0.5) { acc -= 0.5; tickDay(); if (S.over) break; }
    ui(); renderCard();
  }
  if (S) {
    for (const b of S.bubbles) b.ttl -= dt; S.bubbles = S.bubbles.filter(b => b.ttl > 0);
    for (const f of S.fx) f.t += dt * Math.max(1, S.speed); S.fx = S.fx.filter(f => f.t < f.dur);
    draw(now);
  }
  requestAnimationFrame(frame);
}

newGame("bacteria"); resize(); showStart();
requestAnimationFrame(frame);
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
