  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #pad { position: fixed; inset: 0; pointer-events: none; display: none; } body.touch #pad.on { display: block; }
  .btn { position: absolute; pointer-events: auto; border-radius: 50%; border: 2px solid #ffffff77; background: #ffffff22; color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 800; touch-action: none; user-select: none; text-align: center; line-height: 1.05; }
  .btn.down { background: #ffffff55; }
  #bL { left: max(14px, env(safe-area-inset-left)); bottom: 18px; width: 84px; height: 84px; font-size: 34px; } #bR { left: calc(max(14px, env(safe-area-inset-left)) + 98px); bottom: 18px; width: 84px; height: 84px; font-size: 34px; }

  #listBody small { color: var(--dim); }
  .overlay { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: #0d1626ee; padding: 14px; overflow: auto; touch-action: pan-y; }
  .overlay.show { display: flex; }
  .card { width: 100%; max-width: 560px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; max-height: 100%; overflow: auto; }
  .card h1 { margin: 0 0 2px; font-size: 28px; line-height: 1.05; } .card h1 span { color: var(--gold); }
  .card p.sub { color: var(--dim); margin: 0 0 10px; }
  .card h3 { margin: 12px 0 6px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button.b { font: inherit; color: var(--text); background: #223a5e; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 44px; cursor: pointer; flex: 1; }

  @media (max-height: 520px) { .card { padding: 12px 16px; } .card h1 { font-size: 22px; } .card h3 { margin: 8px 0 4px; } button.b { min-height: 38px; padding: 6px 10px; } button.go { margin-top: 8px; min-height: 46px; } #grid button { min-height: 52px; } }

</head>

<canvas id="cv"></canvas>
<div id="pad">
  <div id="bL" class="btn">◀</div><div id="bR" class="btn">▶</div>
  <div id="bUp" class="btn">▲</div><div id="bDn" class="btn">▼</div><div id="bAct" class="btn">ACT</div>
  <div id="bList" class="btn">📋</div><div id="bPause" class="btn">⏸</div>
</div>

<div id="menu" class="overlay show"><div class="card">
  <a class="back" href="../../">← All apps</a>
  <h1 id="title">PRANK <span>DILLAN</span></h1>

  <h3>How to play</h3><div class="help" id="helpTxt"></div>
  <button class="b go" id="startBtn">START EPISODE</button>
  <button class="b" id="fsBtn" style="margin-top:8px;width:100%">⛶ Fullscreen / landscape</button>
</div></div>

<div id="pause" class="overlay"><div class="card"><h1>PAUSED</h1>
  <button class="b go" id="resumeBtn">RESUME</button><button class="b" id="restartBtn" style="margin-top:8px;width:100%">Restart episode</button><button class="b" id="quitBtn" style="margin-top:8px;width:100%">Quit to menu</button></div></div>

<div id="list" class="overlay"><div class="card"><h1>PRANK LIST</h1><p class="sub" id="listSub"></p><div id="listBody"></div><button class="b go" id="listClose">BACK TO THE GAME</button></div></div>

<div id="win" class="overlay"><div class="card">

<div id="fail" class="overlay"><div class="card">

    ` Gold circles show where your item goes (arrows point there if it's off screen). The orange panel shows what ${NAME()} is doing and what he'll do next, so time your traps and hide in a wardrobe, bin, crate or under the furniture. 📋 lists every prank spot. Fill the TV ratings bar before time runs out!`;
}
$("nameIn").addEventListener("input", e => { SET.name = e.target.value; saveSet(); renderMenu(); });
$("startBtn").onclick = () => { SET.name = $("nameIn").value; saveSet(); ac(); startLevel(menuLevel); };
$("resumeBtn").onclick = resume; $("listClose").onclick = () => { $("list").classList.remove("show"); state = "playing"; }; $("bList").addEventListener("pointerdown", e => { e.preventDefault(); showList(); }); $("quitBtn").onclick = toMenu; $("winMenu").onclick = toMenu; $("failMenu").onclick = toMenu;
$("restartBtn").onclick = () => startLevel(curLevel); $("retryBtn").onclick = () => startLevel(curLevel); $("nextBtn").onclick = () => startLevel(curLevel + 1);
$("fsBtn").onclick = async () => { try { await document.documentElement.requestFullscreen(); if (screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape"); } catch {} };

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (G && state === "playing") update(dt); else if (G && (state === "won" || state === "failed")) { G.N.walk += dt; for (const p of G.parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; } G.parts = G.parts.filter(p => p.life > 0); for (const p of G.pop) { p.t -= dt; p.y -= 24 * dt; } G.pop = G.pop.filter(p => p.t > 0); }
  draw(); requestAnimationFrame(frame);
}
$("nameIn").value = NAME(); resize(); menuLevel = clamp(PROG.max, 1, LEVELS.length); renderMenu(); startLevel(1); state = "menu"; $("pad").classList.remove("on"); $("menu").classList.add("show");
requestAnimationFrame(frame);
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
