  if (!P.hidden) { g.fillStyle = PC.dead === 0 && inFront(PC, 1.9, 0.55) ? "#ffd93d" : "#ffffffcc"; g.beginPath(); g.arc(cx, cy, 3 * u, 0, 7); g.fill(); if (PC.dead === 0 && inFront(PC, 1.9, 0.55)) { g.strokeStyle = "#ffd93d"; g.lineWidth = 2; g.beginPath(); g.arc(cx, cy, 10 * u, 0, 7); g.stroke(); } }

  if (flashT > 0) { g.fillStyle = `rgba(255,255,255,${clamp(flashT, 0, 1) * 0.8})`; g.fillRect(0, 0, VW, VH); }
  // PC health bar
  const bw = Math.min(260 * u, VW * 0.34), bx = 14, by = 14;
  g.textAlign = "left"; g.fillStyle = "#fff"; g.font = `bold ${13 * u}px system-ui`; g.fillText(`🖥️ ${NAME()}'s PC`, bx, by + 12 * u);
  g.fillStyle = "#0009"; g.fillRect(bx, by + 18 * u, bw, 12 * u); const hpf = clamp(PC.hp / PC.max, 0, 1); g.fillStyle = hpf > 0.5 ? "#5dffa0" : hpf > 0.25 ? "#ffd93d" : "#ff4d5d"; g.fillRect(bx, by + 18 * u, bw * hpf, 12 * u);
  g.fillStyle = "#cfd8ee"; g.font = `${12 * u}px system-ui`; g.fillText(`${Math.ceil(hpf * 100)}%   ·   🔨 ${P.hammer.name}${P.keys ? "   ·   🔑 " + P.keys : ""}`, bx, by + 46 * u);
  // stealth indicator
  const lab = P.hidden ? "HIDDEN" : P.noiseR > 4 ? "RUNNING (loud)" : P.noiseR > 2 ? "WALKING" : P.noiseR > 0 ? "SNEAKING" : "STILL"; g.fillStyle = P.noiseR > 4 ? "#ff7a7a" : "#9fe6b8"; g.font = `bold ${12 * u}px system-ui`; g.fillText(lab, bx, VH - 16 * u);
  // awareness eye (top centre)
  { const ex = cx, ey = 30 * u + 26 * u; g.textAlign = "center"; g.font = `${22 * u}px system-ui`; g.fillText(D.state === "chase" ? "😡" : D.aware > 0.4 ? "👀" : D.state === "investigate" || D.state === "alarm" || D.state === "search" ? "🤔" : "", ex, ey);
    if (D.aware > 0.02 && D.state !== "chase") { g.fillStyle = "#0008"; g.fillRect(ex - 40 * u, ey + 6 * u, 80 * u, 6 * u); g.fillStyle = D.aware > 0.7 ? "#ff4d5d" : "#ffd93d"; g.fillRect(ex - 40 * u, ey + 6 * u, 80 * u * D.aware, 6 * u); } }

  // floaters (damage numbers)
  g.textAlign = "center"; floaters.forEach((f, i) => { g.font = `bold ${(f.big ? 30 : 22) * u}px system-ui`; g.fillStyle = `rgba(255,${f.big ? 80 : 230},60,${clamp(f.t, 0, 1)})`; g.fillText(f.txt, cx + (i % 2 ? 40 : -40) * u, cy - 40 * u - (1 - f.t) * 60 * u); });
  // toast
  if (toastT > 0 && toastMsg) { g.font = `bold ${14 * u}px system-ui`; const tw = Math.min(VW - 20, g.measureText(toastMsg).width + 28 * u); g.fillStyle = "#000a"; g.fillRect(cx - tw / 2, VH * 0.2, tw, 30 * u); g.fillStyle = "#fff"; g.textAlign = "center"; g.fillText(toastMsg, cx, VH * 0.2 + 20 * u); }
  // arrow to PC
  if (!P.hidden && PC.dead === 0) { const rel = angNorm(Math.atan2(PC.y - P.y, PC.x - P.x) - P.ang), p = project(PC.x, PC.y, 0.5); const onScreen = p && p.x > 0 && p.x < VW && Math.abs(rel) < 1;
    if (!onScreen) { const ax = cx + Math.sin(rel) * Math.min(VW, VH) * 0.4, ay = VH * 0.82 - Math.cos(rel) * 0 ; g.save(); g.translate(clamp(cx + Math.sin(rel) * VW * 0.4, 40, VW - 40), VH * 0.86); g.rotate(Math.sin(rel) > 0 ? 0 : Math.PI); g.fillStyle = "#ffd93dcc"; g.beginPath(); g.moveTo(14 * u, 0); g.lineTo(-8 * u, -10 * u); g.lineTo(-8 * u, 10 * u); g.fill(); g.restore(); g.fillStyle = "#ffd93d"; g.font = `${11 * u}px system-ui`; g.textAlign = "center"; g.fillText("PC", clamp(cx + Math.sin(rel) * VW * 0.4, 40, VW - 40), VH * 0.86 + 24 * u); } }
  // minimap
  const ms = Math.max(2, Math.floor(Math.min(120, VW * 0.26) / MW)), mw = MW * ms, mh = MH * ms, mx0 = VW - mw - 10, my0 = 10;
  g.globalAlpha = 0.75; g.fillStyle = "#000"; g.fillRect(mx0 - 2, my0 - 2, mw + 4, mh + 4);
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) { const i = y * MW + x; if (wallGrid[i]) { g.fillStyle = wallGrid[i] === 11 ? "#c33" : "#5a6475"; g.fillRect(mx0 + x * ms, my0 + y * ms, ms, ms); } else if (solidGrid[i]) { g.fillStyle = "#3a4558"; g.fillRect(mx0 + x * ms, my0 + y * ms, ms, ms); } }
  g.globalAlpha = 1; if (PC.dead === 0) { g.fillStyle = "#ffd93d"; g.fillRect(mx0 + PC.x * ms - 2.5, my0 + PC.y * ms - 2.5, 5, 5); } for (const k of keys) if (!k.got) { g.fillStyle = "#fff"; g.fillRect(mx0 + k.x * ms - 1.5, my0 + k.y * ms - 1.5, 3, 3); }
  const dd = Math.hypot(D.x - P.x, D.y - P.y); if (dd < 7 || D.state === "chase" || hasLOS(P.x, P.y, D.x, D.y)) { g.fillStyle = "#ff4d5d"; g.beginPath(); g.arc(mx0 + D.x * ms, my0 + D.y * ms, 3, 0, 7); g.fill(); }
  g.fillStyle = "#5dffa0"; g.beginPath(); g.arc(mx0 + P.x * ms, my0 + P.y * ms, 2.6, 0, 7); g.fill(); g.strokeStyle = "#5dffa0"; g.beginPath(); g.moveTo(mx0 + P.x * ms, my0 + P.y * ms); g.lineTo(mx0 + (P.x + Math.cos(P.ang) * 2) * ms, my0 + (P.y + Math.sin(P.ang) * 2) * ms); g.stroke();
}

// ---------- input ----------
const lookDelta = (dx, dy) => { input.lookX += dx; input.lookY += dy; };
addEventListener("keydown", e => {
  if (state === "playing") { input.keys[e.code] = true; if (e.code === "Space") { input.smash = true; input.smashEdge = true; } if (e.code === "KeyE" || e.code === "KeyH") input.hideEdge = true; if (e.code === "Escape" || e.code === "KeyP") pauseGame(); if (!/^F\d+$/.test(e.code)) e.preventDefault(); }
  else if (state === "paused" && (e.code === "Escape" || e.code === "KeyP")) resume();
});
addEventListener("keyup", e => { input.keys[e.code] = false; if (e.code === "Space") input.smash = false; });
addEventListener("mousemove", e => { if (document.pointerLockElement === view) lookDelta(e.movementX * 0.55, e.movementY * 0.55); });
addEventListener("mousedown", e => { if (state !== "playing" || isTouch || e.target.closest(".overlay")) return; if (!document.pointerLockElement && view.requestPointerLock) { try { view.requestPointerLock(); } catch {} } if (e.button === 0) { input.smash = true; input.smashEdge = true; } if (e.button === 2) input.hideEdge = true; });
addEventListener("mouseup", e => { if (e.button === 0) input.smash = false; });
addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("pointerlockchange", () => { if (!document.pointerLockElement && state === "playing" && !isTouch) pauseGame(); });
document.addEventListener("visibilitychange", () => { if (document.hidden && state === "playing") pauseGame(); });
(function touchSetup() {
  const stick = $("stickZone"), look = $("lookZone"), base = $("stickBase"), knob = $("stickKnob"); let sid = null, ox = 0, oy = 0, lid = null, lx = 0, ly = 0; const R = 55;
  stick.addEventListener("pointerdown", e => { if (sid !== null) return; sid = e.pointerId; stick.setPointerCapture(sid); ox = e.clientX; oy = e.clientY; base.style.cssText = `display:block;left:${ox}px;top:${oy}px`; knob.style.cssText = `display:block;left:${ox}px;top:${oy}px`; });
  stick.addEventListener("pointermove", e => { if (e.pointerId !== sid) return; let dx = e.clientX - ox, dy = e.clientY - oy; const d = Math.hypot(dx, dy); if (d > R) { dx = dx / d * R; dy = dy / d * R; } knob.style.left = ox + dx + "px"; knob.style.top = oy + dy + "px"; input.mvx = -dy / R; input.mvy = dx / R; if (Math.hypot(input.mvx, input.mvy) < 0.12) input.mvx = input.mvy = 0; });
  const se = e => { if (e.pointerId !== sid) return; sid = null; input.mvx = input.mvy = 0; base.style.display = knob.style.display = "none"; }; stick.addEventListener("pointerup", se); stick.addEventListener("pointercancel", se);
  look.addEventListener("pointerdown", e => { if (lid !== null) return; lid = e.pointerId; look.setPointerCapture(lid); lx = e.clientX; ly = e.clientY; });
  look.addEventListener("pointermove", e => { if (e.pointerId !== lid) return; lookDelta(e.clientX - lx, e.clientY - ly); lx = e.clientX; ly = e.clientY; });
  const le = e => { if (e.pointerId === lid) lid = null; }; look.addEventListener("pointerup", le); look.addEventListener("pointercancel", le);
  const hold = (el, down, up) => { el.addEventListener("pointerdown", e => { el.setPointerCapture(e.pointerId); el.classList.add("down"); down(e); e.preventDefault(); }); const u = () => { el.classList.remove("down"); up && up(); }; el.addEventListener("pointerup", u); el.addEventListener("pointercancel", u); };
  let fid = null, fx = 0, fy = 0; const sb = $("smashBtn");
  hold(sb, e => { input.smash = true; input.smashEdge = true; fid = e.pointerId; fx = e.clientX; fy = e.clientY; }, () => { input.smash = false; fid = null; });
  sb.addEventListener("pointermove", e => { if (e.pointerId !== fid) return; lookDelta(e.clientX - fx, e.clientY - fy); fx = e.clientX; fy = e.clientY; });
  hold($("hideBtn"), () => { input.hideEdge = true; }); hold($("pauseBtn"), () => pauseGame());
})();

// ---------- menus ----------
function seg(boxId, opts, key, after) { const box = $(boxId); box.replaceChildren(); for (const [v, label] of opts) { const b = document.createElement("button"); b.className = "b" + (SET[key] === v ? " on" : ""); b.textContent = label; b.onclick = () => { SET[key] = v; saveSet(); renderMenu(); after && after(); }; box.append(b); } }
let menuLevel = 1;
function renderMenu() {
  seg("qualBtns", [["fast", "Fast"], ["high", "High"]], "qual", resize); seg("sensBtns", [["low", "Low"], ["med", "Medium"], ["high", "High"]], "sens"); seg("soundBtns", [[true, "On"], [false, "Off"]], "sound");
  menuLevel = clamp(menuLevel, 1, PROG.max); $("lvlShow").textContent = `Level ${menuLevel}` + (PROG.best[menuLevel] ? `  ·  best ${PROG.best[menuLevel]}s` : "");
  $("title").innerHTML = `SMASH <span>${NAME().toUpperCase()}</span> PC`; document.title = `Smash ${NAME()} PC`;
  $("helpTxt").innerHTML = isTouch ? `<b>Left thumb:</b> move (push gently to sneak quietly) · <b>Right thumb:</b> look · <b>🔨 SMASH:</b> tap repeatedly next to the PC · <b>HIDE:</b> face a wardrobe and tap. Watch ${NAME()}'s flashlight vision, and remember hammering is LOUD.`
    : `<b>WASD</b> move (hold <b>Shift</b> to sneak) · <b>mouse</b> look · <b>click / Space</b> smash · <b>E</b> hide in a wardrobe · <b>Esc</b> pause. Hammering is LOUD, so smash in bursts and hide.`;
}
$("nameIn").addEventListener("input", e => { SET.name = e.target.value; saveSet(); renderMenu(); });
$("lvlDown").onclick = () => { menuLevel--; renderMenu(); }; $("lvlUp").onclick = () => { menuLevel++; renderMenu(); };
function hideOverlays() { for (const id of ["menu", "pause", "win", "caught"]) $(id).classList.remove("show"); }
function begin() { SET.name = $("nameIn").value; saveSet(); startLevel(menuLevel); ac(); if (!isTouch && view.requestPointerLock) { try { view.requestPointerLock(); } catch {} } }
function pauseGame() { if (state !== "playing") return; state = "paused"; input.smash = false; input.keys = {}; input.mvx = input.mvy = 0; if (document.pointerLockElement) document.exitPointerLock(); $("pause").classList.add("show"); }

$("startBtn").onclick = begin; $("resumeBtn").onclick = resume; $("quitBtn").onclick = toMenu; $("winMenu").onclick = toMenu;

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === "playing") update(dt);
  else if (state === "menu") { P.ang += dt * 0.12; gTime += dt; updateParts(dt); }
  else if (state === "caught" || state === "won") { gTime += dt; D.anim += dt * 6; if (state === "won") { updateParts(dt); PC.dead += dt; follow(dt, D.speed * 1.8); } shake = Math.max(0, shake - dt * 3); flashT = Math.max(0, flashT - dt * 2.5); }

$("nameIn").value = NAME();
startLevel(1); state = "menu"; $("touch").classList.remove("on"); $("menu").classList.add("show"); P.ang = 3.4; P.x = 14.5; P.y = 10.6;
resize(); menuLevel = clamp(PROG.max, 1, PROG.max); renderMenu(); requestAnimationFrame(frame);
