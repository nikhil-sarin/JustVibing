<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Orbital Defence</title>
<style>
  :root {
    --bg: #070b1a; --panel: #0f1630; --line: #243059; --text: #e6ebff; --dim: #8a96c4;
    --pulse: #4de1ff; --nova: #ff9d4d; --cryo: #b48cff; --rail: #7dff9a; --good: #5dffa0; --bad: #ff5d7a; --gold: #ffd54d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden;
    touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  #app { display: flex; flex-direction: column; height: 100%; max-width: 620px; margin: 0 auto;
    padding: env(safe-area-inset-top) 8px env(safe-area-inset-bottom); gap: 6px; }
  #hud { display: flex; justify-content: space-between; align-items: center; padding: 6px 2px 0;
    font-weight: 600; font-variant-numeric: tabular-nums; gap: 8px; }
  #hud span { display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
  #hud small { color: var(--dim); font-weight: 500; }
  #hud button { flex: none; min-height: 34px; padding: 0 10px; border-radius: 10px; font-size: 16px; flex-direction: row; }
  #stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  canvas.game { display: block; border-radius: 12px; border: 1px solid var(--line); background: #050818; }
  #msg { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: #000a;
    padding: 6px 12px; border-radius: 99px; font-size: 13px; pointer-events: none; opacity: 0; transition: opacity .25s; white-space: nowrap; }
  #msg.show { opacity: 1; }
  .row { display: flex; gap: 6px; }
  button { flex: 1; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 8px 4px; min-height: 50px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px; cursor: pointer; }
  button b { font-size: 14px; }
  button small { color: var(--dim); font-size: 12px; text-align: center; line-height: 1.2; }
  button:disabled { opacity: .4; }
  button.on { outline: 2px solid var(--text); background: #1a2350; }
  #towers button { padding: 6px 2px; min-height: 56px; }
  #towers small { font-size: 11px; }
  button[data-t="pulse"] b { color: var(--pulse); } button[data-t="nova"] b { color: var(--nova); }
  button[data-t="cryo"] b { color: var(--cryo); } button[data-t="rail"] b { color: var(--rail); }
  #go { flex: 1.5; background: #1b3d2f; border-color: #2c6b50; } #go b { color: var(--good); }
  #sell small { color: var(--gold); }
  #info { min-height: 54px; display: flex; align-items: center; justify-content: center; text-align: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 5px 8px; color: var(--dim); font-size: 13px; line-height: 1.35; }
  #info > * { width: 100%; }
  #info b { font-size: 14px; }
  #branches button, #abil button { min-height: 42px; background: #1a2350; border-color: #3a4a96; }
  #branches b { color: var(--gold); }
  #abil button { position: relative; overflow: hidden; }
  #abil button .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: #ffffff1c; pointer-events: none; }
  #abil button.armed { outline: 2px solid var(--gold); }
  .overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; background: #050818e6; border-radius: 12px; text-align: center; padding: 20px; }
  .overlay.show { display: flex; }
  #over h1 { margin: 0; font-size: 26px; color: var(--bad); }
  #over button { flex: none; width: 200px; }
  #maps { position: fixed; inset: 0; z-index: 10; background: var(--bg); overflow: auto; display: none;
    padding: max(16px, env(safe-area-inset-top)) 16px 24px; }
  #maps.show { display: block; }
  #maps .inner { max-width: 560px; margin: 0 auto; }
  #maps h1 { margin: 10px 0 2px; font-size: 28px; }
  #maps p.sub { color: var(--dim); margin: 0 0 16px; }
  #maps a { color: var(--dim); text-decoration: none; font-size: 14px; }
  .mapcard { display: flex; gap: 14px; align-items: center; background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 12px; margin-bottom: 12px; cursor: pointer; }
  .mapcard:active { background: #1a2350; }
  .mapcard canvas { width: 72px; height: 104px; border-radius: 10px; background: #050818; flex: none; }
  .mapcard h2 { margin: 0 0 3px; font-size: 18px; }
  .mapcard p { margin: 0 0 6px; color: var(--dim); font-size: 14px; line-height: 1.3; }
  .mapcard .meta { font-size: 12px; color: var(--gold); }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <button id="menu" title="Maps">☰</button>
    <span>🌍 <b id="lives">20</b></span>
    <span>⚡ <b id="gold">120</b></span>
    <span><small>Wave</small> <b id="wave">0</b> <small>· best <span id="best">0</span></small></span>
    <button id="speed" title="Speed / pause">1×</button>
  </div>
  <div id="stage">
    <canvas class="game" id="c"></canvas>
    <div id="msg"></div>
    <div id="over" class="overlay">
      <h1>Earth has fallen</h1>
      <div id="overtxt"></div>
      <button id="again"><b>Try again</b></button>
      <button id="changemap"><b>Change map</b></button>
    </div>
  </div>
  <div id="info">
    <div id="infotxt" hidden></div>
    <div id="branches" class="row" hidden>
      <button id="bA"><b></b><small></small></button>
      <button id="bB"><b></b><small></small></button>
    </div>
    <div id="abil" class="row">
      <button id="strike"><span class="fill"></span><b>☄️ Orbital strike</b><small></small></button>
      <button id="freeze"><span class="fill"></span><b>❄️ Cryo pulse</b><small></small></button>
    </div>
  </div>
  <div class="row" id="towers">
    <button data-t="pulse"><b>Pulse</b><small></small></button>
    <button data-t="nova"><b>Nova</b><small></small></button>
    <button data-t="cryo"><b>Cryo</b><small></small></button>
    <button data-t="rail"><b>Rail</b><small></small></button>
  </div>
  <div class="row" style="padding-bottom:6px">
    <button id="go"><b>Send wave 1</b><small></small></button>
    <button id="up" disabled><b>Upgrade</b><small>select tower</small></button>
    <button id="sell" disabled><b>Sell</b><small>&nbsp;</small></button>
    <button id="tgt" disabled><b>Target</b><small>&nbsp;</small></button>
  </div>
</div>

<div id="maps">
  <div class="inner">
    <a href="../../">← All apps</a>
    <h1>Orbital Defence</h1>
    <p class="sub">Choose a difficulty and a map.</p>
    <div class="row" id="diffRow" style="margin-bottom:12px"></div>
    <div id="mapList"></div>
  </div>
</div>

<script>
"use strict";
// ---------- config ----------
const COLS = 9, ROWS = 13;
const MAPS = [
  { id: "serpent", name: "Serpent", gold: 120, lives: 20, difficulty: "Easy",
    desc: "A long winding lane. Plenty of room, good for learning.",
    wp: [[-1,1],[7,1],[7,4],[1,4],[1,7],[7,7],[7,10],[1,10],[1,12],[8,12]],
    entries: [{ wave: 10, wp: [[9,5],[1,5],[1,7],[7,7],[7,10],[1,10],[1,12],[8,12]] }, { wave: 20, wp: [[-1,9],[7,9],[7,10],[1,10],[1,12],[8,12]] }] },
  { id: "spiral", name: "Spiral", gold: 150, lives: 20, difficulty: "Medium",
    desc: "Enemies spiral inward to Earth at the centre. Very long route, towers in the middle reach everything.",
    wp: [[-1,0],[8,0],[8,12],[0,12],[0,2],[6,2],[6,10],[2,10],[2,4],[4,4],[4,8]],
    entries: [{ wave: 10, wp: [[3,-1],[3,2],[6,2],[6,10],[2,10],[2,4],[4,4],[4,8]] }, { wave: 20, wp: [[5,13],[5,10],[2,10],[2,4],[4,4],[4,8]] }] },
  { id: "crossfire", name: "Crossfire", gold: 170, lives: 15, difficulty: "Hard",
    desc: "A short route that crosses itself. A tower at the junction hits every pass.",
    wp: [[-1,6],[6,6],[6,1],[2,1],[2,11],[8,11]],
    entries: [{ wave: 10, wp: [[9,8],[2,8],[2,11],[8,11]] }, { wave: 20, wp: [[4,-1],[4,1],[2,1],[2,11],[8,11]] }] },
];
const DEFS = {
  pulse: { name: "Pulse", cost: 50,  range: 2.3, dmg: 9,  rate: 0.45, color: "#4de1ff", desc: "fast, cheap", air: true,
    branches: {
      a: { name: "Gatling", desc: "much faster fire", mods: { rate: 0.45, dmg: 0.75 } },
      b: { name: "Arc",     desc: "chains to 2 more", mods: { chain: 2, range: 1.1 } } } },
  nova:  { name: "Nova",  cost: 120, range: 3.0, dmg: 34, rate: 1.5,  color: "#ff9d4d", splash: 1.0, desc: "blast, ground", air: false,
    branches: {
      a: { name: "Supernova", desc: "bigger blast, +dmg", mods: { splash: 1.6, dmg: 1.2 } },
      b: { name: "Mortar",    desc: "long range, heavy",  mods: { range: 1.5, dmg: 1.9, rate: 1.3 } } } },
  cryo:  { name: "Cryo",  cost: 80,  range: 2.3, dmg: 3,  rate: 0.8,  color: "#b48cff", slow: 0.55, desc: "slows", air: true,
    branches: {
      a: { name: "Deep Freeze", desc: "area slow, stronger", mods: { slow: 0.25, slowDur: 2, slowSplash: 1.0 } },
      b: { name: "Shatter",     desc: "6× damage",           mods: { dmg: 6, rate: 0.85 } } } },
  rail:  { name: "Rail",  cost: 160, range: 5.0, dmg: 70, rate: 2.4,  color: "#7dff9a", hitscan: true, armorPierce: true, desc: "sniper, armour-pierce", air: true, mode: "strong",
    branches: {
      a: { name: "Executioner", desc: "huge damage",      mods: { dmg: 1.8, rate: 1.15 } },
      b: { name: "Piercing",    desc: "beam hits a line", mods: { pierce: 1, range: 1.15 } } } },
};
const UP_MULT = [0.7, 1.2, 1.8];            // cost multiplier for level 1->2, 2->3 (branch), 3->4 (elite)
const MODES = ["first", "last", "strong", "weak", "close"];
const MODE_LABEL = { first: "First", last: "Last", strong: "Strongest", weak: "Weakest", close: "Closest" };
const KINDS = {
  rock:     { hp: 32,  speed: 1.1,  reward: 5,  lives: 1, r: 0.26, color: "#9a8f80", gap: 0.75, icon: "🪨" },
  comet:    { hp: 20,  speed: 2.1,  reward: 6,  lives: 1, r: 0.2,  color: "#8fe9ff", gap: 0.45, icon: "☄️" },
  armored:  { hp: 80,  speed: 0.9,  reward: 10, lives: 1, r: 0.3,  color: "#b9c4dc", gap: 1.2,  icon: "🛡️", armor: true },
  dwarf:    { hp: 140, speed: 0.8,  reward: 14, lives: 2, r: 0.36, color: "#c47a5a", gap: 1.6,  icon: "🌑" },
  splitter: { hp: 75,  speed: 0.95, reward: 9,  lives: 1, r: 0.3,  color: "#d36bff", gap: 1.2,  icon: "💎", split: true },
  flyer:    { hp: 30,  speed: 1.5,  reward: 8,  lives: 1, r: 0.26, color: "#6bffd3", gap: 0.9,  icon: "🛸", fly: true },
  boss:     { hp: 900, speed: 0.65, reward: 90, lives: 6, r: 0.55, color: "#ff5d7a", gap: 3,    icon: "👾" },
  mini:     { hp: 14,  speed: 1.4,  reward: 1,  lives: 1, r: 0.16, color: "#e6a6ff", gap: 0,    icon: "·" },
};
const ABILITIES = {
  strike: { cd: 40, radius: 1.7, dmg: 260 },
  freeze: { cd: 50, slow: 0.25, dur: 4 },
};
const EARLY_BONUS = 8;
// difficulty: scales enemy toughness/speed/numbers and squeezes the economy
const DIFFS = {
  normal: { label: "Normal", note: "the original",            hpBase: 1.17,  hp: 1,   spd: 1,    rew: 1,   gold: 1,    lives: 1,   size: 1,    bonus: 1,   armor: 0, elite: 0,    eliteFrom: 99, entryShift: 0 },
  hard:   { label: "Hard",   note: "tougher, faster, leaner",  hpBase: 1.215, hp: 1.1,  spd: 1.1,  rew: 0.8,  gold: 0.9,  lives: 0.8,  size: 1.2,  bonus: 0.8,  armor: 2, elite: 0.12, eliteFrom: 6, entryShift: 2 },
  insane: { label: "Insane", note: "good luck",                hpBase: 1.245, hp: 1.1,  spd: 1.14, rew: 0.65, gold: 0.85, lives: 0.7,  size: 1.25, bonus: 0.65, armor: 4, elite: 0.22, eliteFrom: 5, entryShift: 4 },
};
let DIFFK = (() => { try { const v = JSON.parse(localStorage.getItem("od-diff")); return DIFFS[v] ? v : "hard"; } catch { return "hard"; } })();
const DF = () => DIFFS[DIFFK];

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const cv = $("c"), ctx = cv.getContext("2d");
const key = (c, r) => c + "," + r;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const bestKey = m => "od-best-" + m.id + (DIFFK === "normal" ? "" : "-" + DIFFK);
const bestFor = m => store.get(bestKey(m), m.id === "serpent" && DIFFK === "normal" ? store.get("od-best", 0) : 0);

// ---------- map / path ----------
let MAP, PATHS, pathCells;
function buildPath(wp, start) {
  const pts = wp.map(([c, r]) => ({ x: c + 0.5, y: r + 0.5 })), segLen = [], cum = [0];
  for (let i = 1; i < pts.length; i++) { segLen.push(Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y)); cum.push(cum[i-1] + segLen[i-1]); }
  return { wp, pts, segLen, cum, len: cum[cum.length - 1], fly: Math.hypot(pts[pts.length - 1].x - pts[0].x, pts[pts.length - 1].y - pts[0].y), start };
}
const entryWave = e => Math.max(4, e.wave - DF().entryShift);
function setMap(m) {
  MAP = m;
  PATHS = [buildPath(m.wp, 1), ...(m.entries || []).map(e => buildPath(e.wp, entryWave(e)))];
  pathCells = new Set();                                  // every lane is unbuildable, including ones that open later
  for (const P of PATHS) { P.cells = new Set(); for (let i = 1; i < P.wp.length; i++) {
    const [c0, r0] = P.wp[i-1], [c1, r1] = P.wp[i];
    for (let c = Math.min(c0, c1); c <= Math.max(c0, c1); c++)
      for (let r = Math.min(r0, r1); r <= Math.max(r0, r1); r++) { pathCells.add(key(c, r)); P.cells.add(key(c, r)); }
  } }
}
const lanesAt = n => PATHS.filter(P => P.start <= n).length;
const activeLanes = n => PATHS.map((P, i) => i).filter(i => PATHS[i].start <= n);
function posOn(P, d) {
  d = Math.max(0, Math.min(P.len, d));
  let i = 1;
  while (i < P.cum.length - 1 && P.cum[i] < d) i++;
  const t = (d - P.cum[i-1]) / P.segLen[i-1];
  return { x: P.pts[i-1].x + (P.pts[i].x - P.pts[i-1].x) * t, y: P.pts[i-1].y + (P.pts[i].y - P.pts[i-1].y) * t };
}
// enemies on the ground follow their lane; flyers go straight from their entry point to Earth
function epos(e) {
  const P = PATHS[e.path || 0];
  if (!e.fly) return posOn(P, e.d);
  const t = Math.max(0, Math.min(1, e.d / P.fly)), a = P.pts[0], b = P.pts[P.pts.length - 1];
  return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
}
const totalLen = e => { const P = PATHS[e.path || 0]; return e.fly ? P.fly : P.len; };
const progress = e => e.d / totalLen(e);

// ---------- state ----------
let G;
function newGame() {
  PATHS.forEach((P, i) => { if (i) P.start = entryWave(MAP.entries[i - 1]); });
  G = { lives: Math.max(6, Math.round(MAP.lives * DF().lives)), gold: Math.round(MAP.gold * DF().gold), wave: 0, time: 0, towers: [], enemies: [], shots: [], fx: [], queue: [],
        waveLive: false, over: false, speed: 1, selType: null, sel: null, arm: null, best: bestFor(MAP),
        cd: { strike: 0, freeze: 0 } };
  $("over").classList.remove("show");
  refreshUI();
}
const stars = Array.from({ length: 70 }, () => ({ x: Math.random() * COLS, y: Math.random() * ROWS,
  s: Math.random() * 0.035 + 0.01, p: Math.random() * 6.28 }));

// ---------- tower maths ----------
function stats(t) {
  const d = DEFS[t.type], l = t.level - 1, m = (t.branch && d.branches[t.branch].mods) || {};
  const slow = d.slow ? (m.slow !== undefined ? m.slow : d.slow - 0.1 * l) - (t.branch && t.level >= 4 ? 0.08 : 0) : 1;
  return {
    dmg: d.dmg * (1 + 0.55 * l) * (m.dmg || 1),
    range: d.range * (1 + 0.12 * l) * (m.range || 1),
    rate: d.rate / (1 + 0.18 * l) * (m.rate || 1),
    slow: Math.max(0.12, slow),
    slowDur: 1.6 + (m.slowDur || 0),
    splash: d.splash ? d.splash * (m.splash || 1) * (1 + 0.05 * l) : 0,
    slowSplash: m.slowSplash || 0,
    chain: m.chain || 0,
    pierce: m.pierce || 0,
  };
}
const upCost = t => Math.round(DEFS[t.type].cost * UP_MULT[t.level - 1]);
const sellValue = t => Math.round(t.spent * 0.6);
const needsBranch = t => t.level === 2 && !t.branch;

// ---------- waves ----------
function waveCounts(n) {
  const c = { rock: 5 + n * 2 };
  if (n >= 3) c.comet = 3 + n;
  if (n >= 4) c.armored = Math.max(1, Math.floor(n / 2) - 1);
  if (n >= 5) c.dwarf = Math.floor(n / 2);
  if (n >= 6) c.splitter = Math.floor((n - 3) / 2);
  if (n >= 8) c.flyer = Math.floor(n / 2) - 1;
  const sz = DF().size * (1 + 0.18 * (lanesAt(n) - 1)); if (sz !== 1) for (const k in c) c[k] = Math.round(c[k] * sz);   // more entries, bigger waves
  if (n % 5 === 0) c.boss = Math.floor(n / 5) + (DIFFK === "insane" && n >= 10 ? 1 : 0);
  return c;
}
function buildWave(n) {
  const d = DF(), list = [], hpMul = Math.pow(d.hpBase, n - 1) * d.hp, counts = waveCounts(n);
  for (const [kind, count] of Object.entries(counts)) for (let i = 0; i < count; i++) list.push({ kind, gap: KINDS[kind].gap * (kind === "boss" ? 1 : 1 / Math.sqrt(d.size)), elite: kind !== "boss" && n >= d.eliteFrom && Math.random() < d.elite + Math.min(0.2, (n - d.eliteFrom) * 0.01) });
  for (let i = list.length - 1; i > 0; i--) { if (Math.random() < 0.5) { const j = Math.max(0, i - 1 - (Math.random() * 3 | 0)); [list[i], list[j]] = [list[j], list[i]]; } }
  return { list, hpMul, armor: 4 + n * 0.5 + d.armor };
}
function previewText(n) {
  return Object.entries(waveCounts(n)).map(([k, v]) => `${KINDS[k].icon}${v}`).join(" ") + (PATHS.some((P, i) => i && P.start === n) ? " · 🚨NEW LANE" : "");
}
function sendWave() {
  if (G.over) return;
  const eb = Math.round(EARLY_BONUS * DF().bonus); if (G.waveLive) { G.gold += eb; toast(`Early send +${eb} ⚡`); }
  G.wave++;
  const { list, hpMul, armor } = buildWave(G.wave), lanes = activeLanes(G.wave);
  if (PATHS.some((P, i) => i && P.start === G.wave)) { toast("🚨 NEW ENTRY POINT OPENS!"); for (const i of lanes) if (i && PATHS[i].start === G.wave) { const p = PATHS[i].pts[0]; G.fx.push({ x: clamp(p.x, 0.5, COLS - 0.5), y: clamp(p.y, 0.5, ROWS - 0.5), ring: 1.6, life: 1.2, max: 1.2, c: "#ff5d7a" }); } }
  let at = G.queue.length ? G.queue[G.queue.length - 1].at + 2 : G.time + 0.3;
  for (const it of list) { at += it.gap; G.queue.push({ at, kind: it.kind, hpMul, armor, elite: it.elite, path: lanes[Math.random() * lanes.length | 0] }); }
  G.waveLive = true;
  refreshUI();
}
function makeEnemy(kind, hpMul, armor, d, elite, path) {
  const k = KINDS[kind], hp = k.hp * hpMul * (elite ? 1.8 : 1);
  const nv = kind === "splitter" ? 6 : 9;
  const verts = Array.from({ length: nv }, (_, i) => ({ a: i / nv * 6.283, r: 0.75 + Math.random() * (kind === "splitter" ? 0.15 : 0.4) }));
  return { kind, d, path: path || 0, hp, max: hp, hpMul, elite: !!elite, spd: k.speed * DF().spd * (elite ? 1.15 : 1), armor: k.armor ? armor : 0, fly: !!k.fly, slowT: 0, slowF: 1, verts, rot: Math.random() * 6, dead: false };
}
function spawn(q) { G.enemies.push(makeEnemy(q.kind, q.hpMul, q.armor, 0, q.elite, q.path)); }

function damage(e, dmg, pierce) {
  if (e.dead) return;
  e.hp -= (pierce || !e.armor) ? dmg : Math.max(dmg * 0.25, dmg - e.armor);
  if (e.hp <= 0) {
    e.dead = true;
    G.gold += Math.max(1, Math.round(KINDS[e.kind].reward * DF().rew * (e.elite ? 2 : 1)));
    const p = epos(e);
    for (let i = 0; i < 8; i++) G.fx.push({ x: p.x, y: p.y, vx: (Math.random() - .5) * 3, vy: (Math.random() - .5) * 3, life: .5, max: .5, c: KINDS[e.kind].color });
    if (KINDS[e.kind].split) for (let i = 0; i < 2; i++) G.enemies.push(makeEnemy("mini", e.hpMul, 0, Math.max(0, e.d - 0.25 * i), false, e.path));
    refreshUI();
  }
}
function applySlow(e, factor, dur) { e.slowT = Math.max(e.slowT, dur); e.slowF = Math.min(e.slowF, factor); }
function nearEnemies(x, y, rad, except, groundOnly) {
  return G.enemies.filter(e => { if (e.dead || e === except || (groundOnly && e.fly)) return false; const p = epos(e); return Math.hypot(p.x - x, p.y - y) <= rad; });
}

// ---------- targeting ----------
function pickTarget(t, s) {
  const def = DEFS[t.type], cx = t.c + .5, cy = t.r + .5, mode = t.mode || def.mode || "first";
  let best = null, bv = 0;
  for (const e of G.enemies) {
    if (e.dead || (e.fly && !def.air)) continue;
    const p = epos(e), dist = Math.hypot(p.x - cx, p.y - cy);
    if (dist > s.range) continue;
    const v = mode === "first" ? progress(e) : mode === "last" ? -progress(e) : mode === "strong" ? e.hp : mode === "weak" ? -e.hp : -dist;
    if (!best || v > bv) { best = e; bv = v; }
  }
  return best;
}

// ---------- update ----------
function hit(sh) {
  const def = DEFS[sh.type];
  if (def.splash) {
    G.fx.push({ x: sh.tx, y: sh.ty, ring: sh.splash, life: .3, max: .3, c: def.color });
    for (const e of nearEnemies(sh.tx, sh.ty, sh.splash, null, true)) damage(e, sh.dmg);
    return;
  }
  const tg = sh.target;
  if (tg.dead) return;
  damage(tg, sh.dmg);
  if (def.slow) {
    applySlow(tg, sh.slow, sh.slowDur);
    if (sh.slowSplash) {
      G.fx.push({ x: sh.tx, y: sh.ty, ring: sh.slowSplash, life: .3, max: .3, c: def.color });
      for (const e of nearEnemies(sh.tx, sh.ty, sh.slowSplash, tg)) applySlow(e, sh.slow, sh.slowDur);
    }
  }
  if (sh.chain) {
    let from = { x: sh.tx, y: sh.ty }, used = [tg];
    for (let i = 0; i < sh.chain; i++) {
      const nxt = nearEnemies(from.x, from.y, 1.5).filter(e => !used.includes(e)).sort((a, b) => progress(b) - progress(a))[0];
      if (!nxt) break;
      const p = epos(nxt);
      G.fx.push({ x: from.x, y: from.y, x2: p.x, y2: p.y, line: true, life: .14, max: .14, c: def.color });
      damage(nxt, sh.dmg * 0.6);
      used.push(nxt); from = p;
    }
  }
}
function fireRail(t, s, target) {
  const x = t.c + .5, y = t.r + .5, p = epos(target);
  const ang = Math.atan2(p.y - y, p.x - x), ex = x + Math.cos(ang) * s.range, ey = y + Math.sin(ang) * s.range;
  if (s.pierce) {
    for (const e of G.enemies) {
      if (e.dead || e === target) continue;
      const q = epos(e), proj = (q.x - x) * Math.cos(ang) + (q.y - y) * Math.sin(ang);
      if (proj < 0 || proj > s.range) continue;
      if (Math.abs(-(q.x - x) * Math.sin(ang) + (q.y - y) * Math.cos(ang)) < 0.4) damage(e, s.dmg * 0.75, true);
    }
    G.fx.push({ x, y, x2: ex, y2: ey, line: true, life: .2, max: .2, c: DEFS.rail.color, w: .12 });
  } else {
    G.fx.push({ x, y, x2: p.x, y2: p.y, line: true, life: .2, max: .2, c: DEFS.rail.color, w: .1 });
  }
  damage(target, s.dmg, true);
}

function step(dt) {
  G.time += dt;
  for (const k in G.cd) if (G.cd[k] > 0) G.cd[k] = Math.max(0, G.cd[k] - dt);
  while (G.queue.length && G.queue[0].at <= G.time) spawn(G.queue.shift());

  for (const e of G.enemies) {
    if (e.slowT > 0) e.slowT -= dt; else e.slowF = 1;
    e.d += e.spd * e.slowF * dt;
    e.rot += dt;
    if (e.d >= totalLen(e) && !e.dead) {
      e.dead = true; e.leaked = true;
      G.lives -= KINDS[e.kind].lives;
      flash();
      if (G.lives <= 0) { G.lives = 0; endGame(); }
      refreshUI();
    }
  }

  for (const t of G.towers) {
    t.cd -= dt;
    const s = stats(t), def = DEFS[t.type];
    const target = pickTarget(t, s);
    if (target) {
      const p = epos(target);
      t.angle = Math.atan2(p.y - (t.r + .5), p.x - (t.c + .5));
      if (t.cd <= 0) {
        t.cd = s.rate; t.flash = 0.08;
        if (def.hitscan) fireRail(t, s, target);
        else G.shots.push({ x: t.c + .5, y: t.r + .5, target, tx: p.x, ty: p.y, type: t.type,
          dmg: s.dmg, slow: s.slow, slowDur: s.slowDur, splash: s.splash, slowSplash: s.slowSplash, chain: s.chain });
      }
    }
    if (t.flash > 0) t.flash -= dt;
  }

  for (const sh of G.shots) {
    if (!sh.target.dead) { const p = epos(sh.target); sh.tx = p.x; sh.ty = p.y; }
    const dx = sh.tx - sh.x, dy = sh.ty - sh.y, dist = Math.hypot(dx, dy), mv = 10 * dt;
    if (dist <= mv) { sh.done = true; hit(sh); }
    else { sh.x += dx / dist * mv; sh.y += dy / dist * mv; }
  }

  for (const f of G.fx) { f.life -= dt; if (f.vx !== undefined) { f.x += f.vx * dt; f.y += f.vy * dt; } }
  G.enemies = G.enemies.filter(e => !e.dead);
  G.shots = G.shots.filter(s => !s.done);
  G.fx = G.fx.filter(f => f.life > 0);

  if (G.waveLive && !G.queue.length && !G.enemies.length && !G.over) {
    G.waveLive = false;
    const bonus = Math.round((10 + G.wave * 3) * DF().bonus);
    G.gold += bonus;
    if (G.wave > G.best) { G.best = G.wave; store.set(bestKey(MAP), G.best); }
    toast(`Wave ${G.wave} cleared  +${bonus} ⚡` + (PATHS.some((P, i) => i && P.start === G.wave + 1) ? "  ·  🚨 new lane next wave!" : ""));
    refreshUI();
  }
}

function endGame() {
  G.over = true;
  if (G.wave - 1 > G.best) { G.best = G.wave - 1; store.set(bestKey(MAP), G.best); }
  $("overtxt").textContent = `${MAP.name} (${DF().label}): you held out until wave ${G.wave}. Best: ${G.best}.`;
  $("over").classList.add("show");
  refreshUI();
}

// ---------- abilities ----------
function useStrike(x, y) {
  const a = ABILITIES.strike;
  G.cd.strike = a.cd; G.arm = null;
  G.fx.push({ x, y, ring: a.radius, life: .5, max: .5, c: "#ffd54d" });
  G.fx.push({ x, y, ring: a.radius * .5, life: .35, max: .35, c: "#ffffff" });
  for (const e of nearEnemies(x, y, a.radius)) damage(e, a.dmg, true);
  updateAbil();
}
function useFreeze() {
  const a = ABILITIES.freeze;
  G.cd.freeze = a.cd;
  for (const e of G.enemies) if (!e.dead) applySlow(e, a.slow, a.dur);
  G.fx.push({ x: COLS / 2, y: ROWS / 2, ring: 9, life: .6, max: .6, c: "#8fe9ff" });
  toast("Cryo pulse: everything slowed");
  updateAbil();
}
function updateAbil() {
  for (const k of ["strike", "freeze"]) {
    const b = $(k), cd = G.cd[k], full = ABILITIES[k].cd;
    b.querySelector("small").textContent = G.arm === k ? "tap the map…" : cd > 0 ? Math.ceil(cd) + "s" : "ready";
    b.querySelector(".fill").style.width = (cd > 0 ? (1 - cd / full) * 100 : 100) + "%";
    b.classList.toggle("armed", G.arm === k);
    b.disabled = G.over || (cd > 0 && G.arm !== k);
  }
}

// ---------- ui ----------
let msgTimer = 0, flashT = 0;
function toast(t) { const m = $("msg"); m.textContent = t; m.classList.add("show"); clearTimeout(msgTimer); msgTimer = setTimeout(() => m.classList.remove("show"), 1600); }
function flash() { flashT = 0.25; if (navigator.vibrate) try { navigator.vibrate(60); } catch {} }
const speedLabel = () => G.speed === 0 ? "⏸" : G.speed + "×";

function refreshUI() {
  $("lives").textContent = G.lives; $("gold").textContent = Math.floor(G.gold);
  $("wave").textContent = G.wave; $("best").textContent = G.best;
  $("speed").textContent = speedLabel();
  for (const b of document.querySelectorAll("#towers button")) {
    const d = DEFS[b.dataset.t];
    b.querySelector("small").innerHTML = `⚡${d.cost}<br>${d.desc}`;
    b.disabled = G.gold < d.cost && G.selType !== b.dataset.t;
    b.classList.toggle("on", G.selType === b.dataset.t);
  }
  $("go").querySelector("b").textContent = "Send wave " + (G.wave + 1);
  $("go").querySelector("small").textContent = previewText(G.wave + 1) + (G.waveLive ? ` · +⚡${Math.round(EARLY_BONUS * DF().bonus)} early` : "");

  const t = G.sel, up = $("up"), sell = $("sell"), tgt = $("tgt"), br = $("branches"), txt = $("infotxt");
  let showBranches = false;
  if (t) {
    const d = DEFS[t.type], s = stats(t), bn = t.branch ? d.branches[t.branch] : null;
    if (needsBranch(t)) {
      showBranches = true;
      const cost = upCost(t);
      for (const [id, k] of [["bA", "a"], ["bB", "b"]]) {
        const b = $(id), br2 = d.branches[k];
        b.querySelector("b").textContent = br2.name;
        b.querySelector("small").textContent = `⚡${cost} · ${br2.desc}`;
        b.disabled = G.gold < cost;
      }
    } else {
      const bits = [`dmg ${Math.round(s.dmg)}`, `range ${s.range.toFixed(1)}`, `${(1 / s.rate).toFixed(1)}/s`];
      if (d.slow) bits.push(`slow ${Math.round((1 - s.slow) * 100)}%`);
      if (s.splash) bits.push(`blast ${s.splash.toFixed(1)}`);
      if (s.chain) bits.push(`chain ×${s.chain}`);
      if (s.pierce) bits.push("pierce");
      txt.innerHTML = `<b style="color:${d.color}">${d.name}${bn ? " · " + bn.name : ""}</b> Lv ${t.level}${t.level === 4 ? " ★" : ""}<br>${bits.join(" · ")}`;
    }
    if (needsBranch(t)) { up.disabled = true; up.querySelector("b").textContent = "Pick path"; up.querySelector("small").textContent = "choose above"; }
    else if (t.level >= 4) { up.disabled = true; up.querySelector("b").textContent = "Max"; up.querySelector("small").textContent = "Lv 4 ★"; }
    else { up.disabled = G.gold < upCost(t); up.querySelector("b").textContent = t.level === 3 ? "Elite" : "Upgrade"; up.querySelector("small").textContent = `⚡${upCost(t)} → Lv ${t.level + 1}`; }
    sell.disabled = false; sell.querySelector("small").textContent = `+⚡${sellValue(t)}`;
    tgt.disabled = false; tgt.querySelector("small").textContent = MODE_LABEL[t.mode || DEFS[t.type].mode || "first"];
  } else {
    up.disabled = true; up.querySelector("b").textContent = "Upgrade"; up.querySelector("small").textContent = "select tower";
    sell.disabled = true; sell.querySelector("small").innerHTML = "&nbsp;";
    tgt.disabled = true; tgt.querySelector("small").innerHTML = "&nbsp;";
  }
  br.hidden = !showBranches; txt.hidden = !t || showBranches; $("abil").hidden = !!t;
  updateAbil();
}

document.querySelectorAll("#towers button").forEach(b => b.addEventListener("click", () => {
  const was = G.selType === b.dataset.t;
  G.selType = was ? null : b.dataset.t; G.sel = null; G.arm = null;
  if (!was) toast("Tap a highlighted tile to build");
  refreshUI();
}));
$("go").addEventListener("click", sendWave);
$("speed").addEventListener("click", () => { const seq = [1, 2, 3, 0]; G.speed = seq[(seq.indexOf(G.speed) + 1) % seq.length]; refreshUI(); });
$("up").addEventListener("click", () => {
  const t = G.sel; if (!t || t.level >= 4 || needsBranch(t)) return;
  const c = upCost(t); if (G.gold < c) return;
  G.gold -= c; t.spent += c; t.level++; refreshUI();
});
for (const [id, k] of [["bA", "a"], ["bB", "b"]]) $(id).addEventListener("click", () => {
  const t = G.sel; if (!t || !needsBranch(t)) return;
  const c = upCost(t); if (G.gold < c) return;
  G.gold -= c; t.spent += c; t.level = 3; t.branch = k;
  toast(`${DEFS[t.type].name} → ${DEFS[t.type].branches[k].name}`); refreshUI();
});
$("sell").addEventListener("click", () => {
  const t = G.sel; if (!t) return;
  G.gold += sellValue(t); G.towers = G.towers.filter(x => x !== t); G.sel = null; refreshUI();
});
$("tgt").addEventListener("click", () => {
  const t = G.sel; if (!t) return;
  const cur = t.mode || DEFS[t.type].mode || "first";
  t.mode = MODES[(MODES.indexOf(cur) + 1) % MODES.length]; refreshUI();
});
$("strike").addEventListener("click", () => {
  if (G.over) return;
  if (G.arm === "strike") { G.arm = null; updateAbil(); return; }
  if (G.cd.strike > 0) return;
  G.arm = "strike"; G.selType = null; toast("Tap where to strike"); refreshUI();
});
$("freeze").addEventListener("click", () => { if (!G.over && G.cd.freeze <= 0) useFreeze(); });
$("again").addEventListener("click", newGame);
$("changemap").addEventListener("click", showMenu);
$("menu").addEventListener("click", () => {
  if (G.wave > 0 && !G.over && !confirm("Abandon this run and pick another map?")) return;
  showMenu();
});

cv.addEventListener("pointerdown", ev => {
  if (G.over) return;
  const rc = cv.getBoundingClientRect();
  const fx = (ev.clientX - rc.left) / rc.width * COLS, fy = (ev.clientY - rc.top) / rc.height * ROWS;
  if (G.arm === "strike") { useStrike(fx, fy); return; }
  const c = Math.floor(fx), r = Math.floor(fy);
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return;
  const existing = G.towers.find(t => t.c === c && t.r === r);
  if (existing) { G.sel = existing; G.selType = null; }
  else if (G.selType && !pathCells.has(key(c, r))) {
    const d = DEFS[G.selType];
    if (G.gold >= d.cost) {
      G.gold -= d.cost;
      G.towers.push({ c, r, type: G.selType, level: 1, branch: null, mode: d.mode || "first", cd: 0, angle: -1.57, spent: d.cost, flash: 0 });
      if (G.gold < d.cost) G.selType = null;
    } else toast("Not enough ⚡");
  } else { G.sel = null; if (pathCells.has(key(c, r)) && G.selType) { const k = key(c, r), fut = PATHS.find(P => P.start > G.wave && P.cells.has(k) && !PATHS[0].cells.has(k)); toast(fut ? `Reserved: a new entry opens on wave ${fut.start}` : "Can't build on the flight path"); } }
  refreshUI();
});

// ---------- map menu ----------
function drawPreview(canvas, m) {
  const s = 8, x = canvas.getContext("2d");
  canvas.width = COLS * s; canvas.height = ROWS * s;
  x.lineJoin = "round"; x.lineCap = "round";
  for (const e of (m.entries || [])) { x.beginPath(); e.wp.forEach(([c, r], i) => { const px = (c + .5) * s, py = (r + .5) * s; i ? x.lineTo(px, py) : x.moveTo(px, py); }); x.strokeStyle = "#6a2a44"; x.lineWidth = s * .45; x.stroke(); }
  x.beginPath(); m.wp.forEach(([c, r], i) => { const px = (c + .5) * s, py = (r + .5) * s; i ? x.lineTo(px, py) : x.moveTo(px, py); });
  x.strokeStyle = "#2a3a7a"; x.lineWidth = s * .7; x.stroke();
  const [ec, er] = m.wp[m.wp.length - 1];
  x.fillStyle = "#4aa3ff"; x.beginPath(); x.arc((ec + .5) * s, (er + .5) * s, s * .55, 0, 6.283); x.fill();
}
function showMenu() {
  const dr = $("diffRow"); dr.replaceChildren();
  for (const [k, d] of Object.entries(DIFFS)) { const b = document.createElement("button"); b.className = k === DIFFK ? "on" : ""; b.innerHTML = `<b>${d.label}</b><small>${d.note}</small>`; b.onclick = () => { DIFFK = k; store.set("od-diff", k); showMenu(); }; dr.append(b); }
  const list = $("mapList"); list.replaceChildren();
  for (const m of MAPS) {
    const card = document.createElement("div"); card.className = "mapcard";
    const pv = document.createElement("canvas"); drawPreview(pv, m);
    const body = document.createElement("div");
    const best = bestFor(m);
    body.innerHTML = `<h2>${m.name}</h2><p>${m.desc}</p><div class="meta">${m.difficulty} layout · ⚡${Math.round(m.gold * DF().gold)} · 🌍${Math.max(6, Math.round(m.lives * DF().lives))}${best ? " · best wave " + best : ""}</div>`;
    card.append(pv, body);
    card.addEventListener("click", () => { setMap(m); newGame(); $("maps").classList.remove("show"); resize(); });
    list.append(card);
  }
  $("maps").classList.add("show");
}

// ---------- rendering ----------
let cell = 40, dpr = 1;
function resize() {
  const st = $("stage").getBoundingClientRect();
  cell = Math.max(20, Math.floor(Math.min((st.width - 2) / COLS, (st.height - 2) / ROWS)));
  dpr = window.devicePixelRatio || 1;
  cv.style.width = cell * COLS + "px"; cv.style.height = cell * ROWS + "px";
  cv.width = Math.round(cell * COLS * dpr); cv.height = Math.round(cell * ROWS * dpr);
}
addEventListener("resize", resize);

function poly(vs, x, y, r, rot) {
  ctx.beginPath();
  vs.forEach((v, i) => { const a = v.a + rot, px = x + Math.cos(a) * r * v.r, py = y + Math.sin(a) * r * v.r; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
  ctx.closePath();
}

function drawTower(t) {
  const x = t.c + .5, y = t.r + .5, col = DEFS[t.type].color, sel = G.sel === t;
  ctx.fillStyle = "#18204a";
  ctx.strokeStyle = sel ? "#fff" : t.level >= 4 ? "#ffd54d" : t.branch ? col : "#33427f";
  ctx.lineWidth = sel ? 0.06 : t.branch ? 0.06 : 0.04;
  ctx.beginPath(); ctx.arc(x, y, .38, 0, 6.283); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.translate(x, y); ctx.rotate(t.angle);
  ctx.fillStyle = col;
  const b = t.branch;
  if (t.type === "pulse") {
    if (b === "a") { ctx.fillRect(0, -.13, .44, .08); ctx.fillRect(0, .05, .44, .08); }
    else { ctx.fillRect(0, -.05, .42, .1); if (b === "b") { ctx.strokeStyle = col; ctx.lineWidth = .04; ctx.beginPath(); ctx.arc(.44, 0, .08, 0, 6.283); ctx.stroke(); } }
  } else if (t.type === "nova") {
    if (b === "b") ctx.fillRect(0, -.07, .5, .14);
    else { const w = b === "a" ? .17 : .11; ctx.fillRect(0, -w, .4, w * 2); ctx.fillStyle = "#fff6"; ctx.fillRect(.3, -w * .6, .1, w * 1.2); }
  } else if (t.type === "rail") {
    ctx.fillRect(0, -.04, .55, .08); ctx.fillRect(-.05, -.14, .18, .28);
    ctx.fillStyle = "#fff8"; ctx.fillRect(.1, -.02, .4, .04);
    if (b === "b") { ctx.fillStyle = col; ctx.fillRect(.3, -.12, .05, .24); }
    if (b === "a") { ctx.fillStyle = "#ffd54d"; ctx.fillRect(.5, -.07, .08, .14); }
  } else {
    const w = b === "a" ? .17 : .12;
    ctx.beginPath(); ctx.moveTo(.42, 0); ctx.lineTo(0, -w); ctx.lineTo(0, w); ctx.closePath(); ctx.fill();
    if (b === "b") { ctx.beginPath(); ctx.moveTo(.3, 0); ctx.lineTo(-.05, -.22); ctx.lineTo(-.05, .22); ctx.closePath(); ctx.fillStyle = col + "99"; ctx.fill(); }
  }
  ctx.restore();
  ctx.fillStyle = t.flash > 0 ? "#fff" : col; ctx.beginPath(); ctx.arc(x, y, .14, 0, 6.283); ctx.fill();
  for (let i = 0; i < t.level; i++) { ctx.fillStyle = "#ffd54d"; ctx.beginPath(); ctx.arc(x - (t.level - 1) * .07 + i * .14, y + .3, .035, 0, 6.283); ctx.fill(); }
}

function drawEnemy(e) {
  const k = KINDS[e.kind], p = epos(e);
  if (e.kind === "comet") {
    const q = posOn(PATHS[e.path || 0], e.d - 0.7), tg = ctx.createLinearGradient(p.x, p.y, q.x, q.y);
    tg.addColorStop(0, k.color); tg.addColorStop(1, "#8fe9ff00");
    ctx.strokeStyle = tg; ctx.lineWidth = k.r * 1.4; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(p.x, p.y, k.r, 0, 6.283); ctx.fill();
  } else if (e.kind === "flyer") {
    ctx.fillStyle = "#0006"; ctx.beginPath(); ctx.ellipse(p.x + .08, p.y + .16, k.r, k.r * .4, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = k.color; ctx.beginPath(); ctx.ellipse(p.x, p.y, k.r * 1.1, k.r * .5, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = "#e6fff8"; ctx.beginPath(); ctx.ellipse(p.x, p.y - k.r * .25, k.r * .5, k.r * .4, 0, Math.PI, 0); ctx.fill();
  } else {
    poly(e.verts, p.x, p.y, k.r, e.rot);
    ctx.fillStyle = k.color; ctx.fill();
    ctx.strokeStyle = e.kind === "armored" ? "#fff" : "#0006"; ctx.lineWidth = e.kind === "armored" ? 0.07 : 0.03; ctx.stroke();
    if (e.kind === "splitter") { ctx.fillStyle = "#fff5"; ctx.beginPath(); ctx.arc(p.x - k.r * .2, p.y - k.r * .2, k.r * .3, 0, 6.283); ctx.fill(); }
    else { ctx.fillStyle = "#0004"; ctx.beginPath(); ctx.arc(p.x - k.r * .25, p.y - k.r * .15, k.r * .22, 0, 6.283); ctx.fill(); }
  }
  if (e.elite) { ctx.strokeStyle = "#ffd93d"; ctx.lineWidth = 0.06; ctx.beginPath(); ctx.arc(p.x, p.y, k.r + 0.13, 0, 6.283); ctx.stroke(); }
  if (e.slowF < 1) { ctx.strokeStyle = "#b48cff"; ctx.lineWidth = 0.04; ctx.beginPath(); ctx.arc(p.x, p.y, k.r + .08, 0, 6.283); ctx.stroke(); }
  if (e.hp < e.max) {
    const w = Math.max(0.4, k.r * 2);
    ctx.fillStyle = "#000a"; ctx.fillRect(p.x - w / 2, p.y - k.r - .16, w, .06);
    ctx.fillStyle = "#5dffa0"; ctx.fillRect(p.x - w / 2, p.y - k.r - .16, w * Math.max(0, e.hp / e.max), .06);
  }
}

function draw() {
  ctx.setTransform(cell * dpr, 0, 0, cell * dpr, 0, 0);
  ctx.clearRect(0, 0, COLS, ROWS);
  for (const s of stars) {
    ctx.globalAlpha = 0.4 + 0.4 * Math.sin(G.time * 1.5 + s.p);
    ctx.fillStyle = "#cfd8ff"; ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.lineJoin = "round"; ctx.lineCap = "round";
  PATHS.forEach((P, li) => {
    const open = P.start <= G.wave, soon = !open && P.start === G.wave + 1;
    ctx.beginPath(); P.pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    if (open) {
      ctx.strokeStyle = "#141c3d"; ctx.lineWidth = 0.86; ctx.stroke();
      ctx.strokeStyle = li ? "#2a2250" : "#1d2858"; ctx.lineWidth = 0.7; ctx.stroke();
      ctx.setLineDash([0.12, 0.3]); ctx.strokeStyle = li ? "#7a4aa0" : "#3a4a96"; ctx.lineWidth = 0.04; ctx.stroke(); ctx.setLineDash([]);
    } else {            // a lane that opens later: shown as a dim warning so you don't build on it and can plan ahead
      const pulse = soon ? 0.55 + 0.35 * Math.sin(G.time * 6) : 0.4;
      ctx.globalAlpha = pulse; ctx.strokeStyle = "#2a1020"; ctx.lineWidth = 0.8; ctx.stroke(); ctx.strokeStyle = "#5a1d34"; ctx.lineWidth = 0.62; ctx.stroke();
      ctx.setLineDash([0.14, 0.22]); ctx.strokeStyle = "#ff5d7a"; ctx.lineWidth = 0.05; ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    // entry marker at the first point that is on the board
    const ei = P.pts.findIndex(p => p.x > 0 && p.x < COLS && p.y > 0 && p.y < ROWS), a0 = P.pts[Math.max(0, ei - 1)], b0 = P.pts[ei], dx = b0.x - a0.x, dy = b0.y - a0.y, dl = Math.hypot(dx, dy) || 1;
    const ex = clamp(a0.x, 0.3, COLS - 0.3), ey = clamp(a0.y, 0.3, ROWS - 0.3), ux = dx / dl, uy = dy / dl, pl = 1 + 0.15 * Math.sin(G.time * 5);
    ctx.save(); ctx.translate(ex + ux * 0.25, ey + uy * 0.25); ctx.rotate(Math.atan2(uy, ux)); ctx.globalAlpha = open ? 0.95 : 0.8;
    ctx.fillStyle = open ? "#ff5d7a" : "#ff5d7a99"; ctx.beginPath(); ctx.moveTo(0.3 * pl, 0); ctx.lineTo(-0.15, -0.26 * pl); ctx.lineTo(-0.15, 0.26 * pl); ctx.closePath(); ctx.fill(); ctx.restore(); ctx.globalAlpha = 1;
    if (!open) { ctx.font = "bold 0.3px system-ui"; ctx.textAlign = "center"; ctx.fillStyle = soon ? "#ffd0d8" : "#ff9db0"; ctx.fillText(`⚠ wave ${P.start}`, clamp(ex, 0.9, COLS - 0.9), clamp(ey + (ey < 1 ? 0.75 : -0.45), 0.35, ROWS - 0.2)); }
  });

  if (G.selType) {
    ctx.fillStyle = "#ffffff10";
    for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++)
      if (!pathCells.has(key(c, r)) && !G.towers.some(t => t.c === c && t.r === r)) ctx.fillRect(c + 0.06, r + 0.06, 0.88, 0.88);
  }

  const ep = PATHS[0].pts[PATHS[0].pts.length - 1];
  const g = ctx.createRadialGradient(ep.x - .15, ep.y - .15, .05, ep.x, ep.y, .5);
  g.addColorStop(0, "#6fd0ff"); g.addColorStop(.6, "#2a78c8"); g.addColorStop(1, "#0b2c63");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ep.x, ep.y, .46, 0, 6.283); ctx.fill();
  ctx.fillStyle = "#4fbf6a99"; ctx.beginPath(); ctx.arc(ep.x - .12, ep.y - .05, .16, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(ep.x + .14, ep.y + .15, .1, 0, 6.283); ctx.fill();

  if (G.sel) { const s = stats(G.sel), c = DEFS[G.sel.type].color;
    ctx.beginPath(); ctx.arc(G.sel.c + .5, G.sel.r + .5, s.range, 0, 6.283); ctx.fillStyle = c + "18"; ctx.fill(); ctx.strokeStyle = c + "99"; ctx.lineWidth = 0.03; ctx.stroke(); }

  for (const t of G.towers) drawTower(t);
  for (const e of G.enemies) drawEnemy(e);

  for (const s of G.shots) {
    ctx.fillStyle = DEFS[s.type].color; ctx.beginPath(); ctx.arc(s.x, s.y, s.type === "nova" ? .1 : .06, 0, 6.283); ctx.fill();
  }
  for (const f of G.fx) {
    const a = Math.max(0, f.life / f.max);
    ctx.globalAlpha = a;
    if (f.ring) { ctx.strokeStyle = f.c; ctx.lineWidth = .06; ctx.beginPath(); ctx.arc(f.x, f.y, f.ring * (1 - a * .6), 0, 6.283); ctx.stroke(); }
    else if (f.line) { ctx.strokeStyle = f.c; ctx.lineWidth = f.w || .07; ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x2, f.y2); ctx.stroke(); }
    else { ctx.fillStyle = f.c; ctx.beginPath(); ctx.arc(f.x, f.y, .05, 0, 6.283); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  if (G.arm === "strike") { ctx.fillStyle = "#ffd54d10"; ctx.fillRect(0, 0, COLS, ROWS); }
  if (flashT > 0) { ctx.fillStyle = `rgba(255,60,90,${flashT})`; ctx.fillRect(0, 0, COLS, ROWS); }
}

// ---------- main loop ----------
let last = performance.now(), abilTick = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!G.over && !document.hidden && !$("maps").classList.contains("show")) for (let i = 0; i < G.speed; i++) step(dt);
  if (flashT > 0) flashT -= dt;
  abilTick += dt; if (abilTick > 0.25) { abilTick = 0; updateAbil(); }
  draw();
  requestAnimationFrame(frame);
}

setMap(MAPS[0]);
newGame();
resize();
showMenu();
requestAnimationFrame(frame);
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
