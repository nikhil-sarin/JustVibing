<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b1a">
<link rel="icon" href="apps/tower-defence/icon.svg" type="image/svg+xml">
<title>JustVibing</title>
<style>
  :root { --bg: #070b1a; --panel: #0f1630; --line: #243059; --text: #e6ebff; --dim: #8a96c4; --accent: #4de1ff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh;
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); }
  main { max-width: 640px; margin: 0 auto; }
  h1 { margin: 12px 0 2px; font-size: 28px; letter-spacing: -.5px; }
  .sub { color: var(--dim); margin: 0 0 20px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .filters button { font: inherit; font-size: 14px; color: var(--dim); background: none; border: 1px solid var(--line);
    border-radius: 99px; padding: 6px 14px; cursor: pointer; }
  .filters button.on { color: var(--bg); background: var(--accent); border-color: var(--accent); }
  .grid { display: grid; gap: 12px; }
  a.card { display: flex; gap: 14px; align-items: center; text-decoration: none; color: inherit;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  a.card:active { background: #1a2350; }
  a.card img { width: 64px; height: 64px; border-radius: 14px; flex: none; background: #000; }
  .card h2 { margin: 0 0 3px; font-size: 18px; }
  .card p { margin: 0; color: var(--dim); font-size: 14px; }
  .tag { display: inline-block; margin-top: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
  .empty { color: var(--dim); text-align: center; padding: 30px 0; }
</style>
</head>
<body>
<main>
  <h1>JustVibing</h1>
  <p class="sub">My little apps and games.</p>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
</main>
<script>
const grid = document.getElementById("grid"), filters = document.getElementById("filters");
let apps = [], active = "All";

function render() {
  const shown = apps.filter(a => active === "All" || a.category === active);
  grid.replaceChildren(...shown.map(a => {
    const el = document.createElement("a");
    el.className = "card"; el.href = a.path;
    const img = new Image(); img.src = a.path + (a.icon || "icon.svg"); img.alt = "";
    const body = document.createElement("div");
    const h = document.createElement("h2"); h.textContent = a.name;
    const p = document.createElement("p"); p.textContent = a.description;
    const t = document.createElement("span"); t.className = "tag"; t.textContent = a.category;
    body.append(h, p, t); el.append(img, body);
    return el;
  }));
  if (!shown.length) grid.innerHTML = '<div class="empty">Nothing here yet.</div>';
  for (const b of filters.children) b.classList.toggle("on", b.textContent === active);
}

fetch("apps.json").then(r => r.json()).then(list => {
  apps = list;
  const cats = ["All", ...new Set(list.map(a => a.category))];
  if (cats.length > 2) filters.replaceChildren(...cats.map(c => {
    const b = document.createElement("button"); b.textContent = c;
    b.onclick = () => { active = c; render(); }; return b;
  }));
  render();
}).catch(() => { grid.innerHTML = '<div class="empty">Couldn\'t load apps.json. Serve this over http(s), not file://.</div>'; });
</script>
</body>
</html>
